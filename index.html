<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helidirect - Human Resource Management</title>
<style>
/* Bảng màu & kiểu chữ theo CHUẨN VĂN BẢN HC-NS HELIDIRECT (docs/HD-document-standard.md) */
:root{
  --bg:#fafafa; --panel:#fff; --line:#cccccc; --line-soft:#e6e6e6; --fill:#f5f5f5;
  --ink:#000000; --text:#444444; --muted:#666666;
  --accent:#000000; --accent-d:#333333; --danger:#9e3b32; --warn:#8a5a12; --radius:6px;
  --font:Averta,"Avenir Next","Segoe UI",Inter,-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.6 var(--font);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
b,strong,h1,h2,h3,h4{color:var(--ink)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.btn{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:7px 14px;font-weight:700;color:var(--ink)}
.btn:hover{background:var(--fill)}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d)}
.btn.ghost{border:none;background:transparent;color:var(--muted);padding:6px 8px}
.btn.danger{color:var(--danger);border-color:#ddc6c3}
.btn.sm{padding:5px 10px;font-size:13px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.2px}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;background:#fff;width:100%;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--ink);outline-offset:-2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hide{display:none!important}

header{display:flex;align-items:baseline;gap:0;padding:13px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:2.2px;font-size:20px;line-height:1;color:var(--ink);text-transform:uppercase;margin-right:-2.2px}
.brandsub{color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;
  line-height:1;padding:3px 0 3px 13px;margin-left:13px;border-left:1px solid var(--line)}
.spacer{flex:1}
header .btn,header .who{align-self:center}
.who{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:none;background:none;padding:11px 14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;letter-spacing:.1px}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--ink)}
.toolbar{display:flex;gap:8px;align-items:center;padding:14px 20px 0;flex-wrap:wrap}
.toolbar input[type=search],.toolbar select{border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;background:#fff;color:var(--ink)}
.toolbar input[type=search]{width:260px}
label.check{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
main{padding:14px 20px 48px}
h2.sec{margin:0 0 12px;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.2px}

.summary{display:flex;gap:6px;margin-bottom:14px}
.sum{flex:1;border-radius:var(--radius);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}
.sum b{font-size:16px}
.board{display:flex;gap:14px;overflow-x:auto;align-items:flex-start;min-height:50vh}
.col{flex:0 0 272px;background:var(--fill);border:1px solid var(--line-soft);border-radius:var(--radius);padding:10px;min-height:120px}
.col.over{outline:2px dashed var(--ink);outline-offset:-2px;background:#ededed}
.col h3{margin:2px 4px 10px;font-size:12.5px;display:flex;justify-content:space-between;color:var(--ink);font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;cursor:grab}
.card:hover{border-color:var(--ink)}
.card.dragging{opacity:.45}
.card .nm{font-weight:700;margin-bottom:2px;word-break:break-word}
.card .sub{color:var(--muted);font-size:11.5px;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:var(--fill);border:1px solid var(--line-soft);border-radius:999px;padding:2px 9px;font-size:11px;color:var(--text);white-space:nowrap}
.tag.warn{background:#fbeceb;border-color:#eed6d3;color:#9e3b32}
.tag.ok{background:#eef2ef;border-color:#d6ded9;color:#1f5c48}
.tag.soon{background:#fbf4e8;border-color:#eadfc8;color:#8a5a12}
.empty{color:var(--muted);font-size:12.5px;padding:10px 4px}

table.grid{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table.grid th,table.grid td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.grid td{font-size:13px;color:var(--text)}
table.grid th{background:var(--fill);font-size:12px;color:var(--ink);font-weight:700;letter-spacing:.2px;border-bottom:1px solid var(--line)}
table.grid tr:last-child td{border-bottom:none}
table.grid tbody tr:hover{background:#fcfcfc;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.panel h4{margin:0 0 6px;font-size:14px;font-weight:700;color:var(--ink)}
.meta{color:var(--muted);font-size:12px;line-height:1.55}
.bar{height:6px;background:var(--fill);border:1px solid var(--line-soft);border-radius:999px;overflow:hidden;margin:8px 0}
.bar > i{display:block;height:100%;background:var(--ink)}

.org{display:flex;gap:10px;flex-direction:column}
.org ul{list-style:none;margin:0;padding-left:22px;border-left:1px solid var(--line)}
.org > ul{padding-left:0;border-left:none}
.org li{margin:6px 0}
.node{display:inline-flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;min-width:200px}
.node b{font-size:13px;color:var(--ink)}
.node span{color:var(--muted);font-size:11.5px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;z-index:40}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:460px;max-width:96vw;background:#fff;z-index:50;transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.10)}
.drawer.on{transform:none}
.drawer header{border-bottom:1px solid var(--line)}
.drawer .body{padding:16px 20px;overflow:auto;flex:1}
.modal{position:fixed;z-index:50;top:50%;left:50%;transform:translate(-50%,-50%);width:640px;max-width:95vw;max-height:88vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px;display:none;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.modal.on{display:block}
.modal h2{margin:0 0 14px;font-size:16px;font-weight:700;color:var(--ink);letter-spacing:.2px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.ev{border-left:1px solid var(--line);padding:0 0 12px 12px;margin-left:4px}
.ev .when{font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:var(--radius);z-index:90;display:none;max-width:90vw;font-size:13px}
.toast.on{display:block}
#login{max-width:400px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:34px 32px}
#login h1{margin:0 0 8px;font-size:26px;font-weight:700;letter-spacing:3px;color:var(--ink);text-transform:uppercase;line-height:1}
#login p{color:var(--muted);margin:0 0 18px}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.checklist li.done span.t{text-decoration:line-through;color:var(--muted)}
.checklist input{margin-top:3px}

/* ---------- CHUYỂN ĐỘNG ---------- */
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes itemIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.015)}100%{transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes modalIn{from{opacity:0;transform:translate(-50%,-50%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes overPulse{0%,100%{background:#ededed}50%{background:#e4e4e4}}
@keyframes barGrow{from{width:0}}

.vin{animation:viewIn .22s cubic-bezier(.2,.7,.3,1)}
.cards > *{animation:itemIn .3s cubic-bezier(.2,.7,.3,1) backwards}
.cards > *:nth-child(1){animation-delay:0ms}   .cards > *:nth-child(2){animation-delay:35ms}
.cards > *:nth-child(3){animation-delay:70ms}  .cards > *:nth-child(4){animation-delay:105ms}
.cards > *:nth-child(5){animation-delay:140ms} .cards > *:nth-child(6){animation-delay:175ms}
.cards > *:nth-child(n+7){animation-delay:200ms}
table.grid tbody tr{animation:rowIn .28s ease-out backwards}
table.grid tbody tr:nth-child(1){animation-delay:0ms}  table.grid tbody tr:nth-child(2){animation-delay:20ms}
table.grid tbody tr:nth-child(3){animation-delay:40ms} table.grid tbody tr:nth-child(4){animation-delay:60ms}
table.grid tbody tr:nth-child(5){animation-delay:80ms} table.grid tbody tr:nth-child(n+6){animation-delay:95ms}
table.grid tbody tr{transition:background .15s ease}

nav{position:relative}
nav button{transition:color .18s ease}
nav button.on{border-bottom-color:transparent}
.nav-ind{position:absolute;bottom:0;left:0;height:2px;width:0;background:var(--ink);opacity:0;border-radius:2px;
  transition:transform .28s cubic-bezier(.4,0,.2,1),width .28s cubic-bezier(.4,0,.2,1),opacity .18s ease;pointer-events:none}

.btn{transition:background .15s ease,border-color .15s ease,color .15s ease,transform .08s ease,box-shadow .15s ease}
.btn:active{transform:translateY(1px)}
.btn.primary:hover{box-shadow:0 2px 10px rgba(0,0,0,.18)}
.tag{transition:background .15s ease,border-color .15s ease}

.card{transition:border-color .15s ease,box-shadow .18s ease,transform .18s cubic-bezier(.2,.7,.3,1),opacity .15s ease}
.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.06);transform:translateY(-1px)}
.card.dragging{opacity:.5;transform:rotate(-1.6deg) scale(.985);box-shadow:0 10px 22px rgba(0,0,0,.14);cursor:grabbing}
.card.landed{animation:pop .34s cubic-bezier(.2,.7,.3,1)}
.col{transition:background .18s ease,outline-color .18s ease}
.col.over{animation:overPulse 1s ease-in-out infinite}
.col.over .card{transform:translateY(1px)}

.panel{transition:border-color .15s ease,box-shadow .18s ease}
.bar > i{transition:width .55s cubic-bezier(.2,.8,.2,1);animation:barGrow .55s cubic-bezier(.2,.8,.2,1)}
.toast.on{animation:toastIn .24s cubic-bezier(.2,.7,.3,1)}
.modal.on{animation:modalIn .2s cubic-bezier(.2,.7,.3,1)}
.scrim{transition:opacity .18s ease}
.field input,.field select,.field textarea{transition:border-color .15s ease,box-shadow .15s ease}
.sum{transition:transform .18s cubic-bezier(.2,.7,.3,1)}
.sum:hover{transform:translateY(-2px)}
.node{transition:border-color .15s ease,transform .18s ease}
.node:hover{transform:translateY(-1px);border-color:var(--ink)}
.checklist li{transition:opacity .2s ease}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div id="login" class="hide">
  <h1>HELIDIRECT</h1>
  <div class="brandsub" style="margin-bottom:18px;padding:0;margin-left:0;border:0;font-size:10.5px">Human Resource Management</div>
  <p>Đăng nhập bằng email công ty (@helidirect.com). Hệ thống gửi link đăng nhập dùng 1 lần.</p>
  <form id="loginForm">
    <div class="field"><label>Email</label><input type="email" id="loginEmail" required placeholder="ban@helidirect.com"></div>
    <button class="btn primary" style="width:100%">Gửi link đăng nhập</button>
  </form>
  <p id="loginMsg" style="margin-top:12px"></p>
</div>

<div id="app" class="hide">
  <header>
    <span class="logo">HELIDIRECT</span><span class="brandsub">Human Resource Management</span>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <a class="btn" href="./selftest.html" title="Chạy kiểm tra toàn bộ chức năng">Kiểm tra hệ thống</a>
    <button class="btn" id="btnRefresh">Làm mới</button>
    <button class="btn ghost" id="btnLang" title="Tiếng Việt / English" style="min-width:52px">EN</button>
    <button class="btn ghost" id="btnOut">Thoát</button>
  </header>
  <nav id="nav"></nav>
  <div class="toolbar" id="toolbar"></div>
  <main id="view"></main>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <header style="display:flex;align-items:center;padding:12px 16px">
    <strong id="dName" style="flex:1"></strong>
    <button class="btn ghost" id="dClose">✕</button>
  </header>
  <div class="body" id="dBody"></div>
</div>
<div class="modal" id="modal"><h2 id="mTitle"></h2><div id="mBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="cvFile" accept=".pdf,.docx,.txt" class="hide">
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.3';
const sb = createClient('https://hzsybxvvcexayducvfll.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6c3lieHZ2Y2V4YXlkdWN2ZmxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NTMxMTQsImV4cCI6MjEwMDEyOTExNH0.Fk_dc8nYfJGwlrbEwVSIpoFIM3WeHUPzXKP38jsM9Ac');

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = (s) => esc(s).replace(/\n/g, '<br>');
const d = (s) => s ? new Date(s).toLocaleDateString('vi-VN') : '';
const money = (n) => n == null ? '' : Number(n).toLocaleString('vi-VN');
// ngày theo múi giờ máy người dùng, không theo UTC: trước 07:00 giờ VN, UTC vẫn là "hôm qua"
const ymd = (x) => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
const today = () => ymd(new Date());
const addDays = (iso, n) => { const x = new Date(String(iso).slice(0, 10) + 'T00:00:00'); x.setDate(x.getDate() + n); return ymd(x); };
const dayDiff = (iso) => Math.round((Date.parse(String(iso).slice(0, 10) + 'T00:00:00Z') - Date.parse(today() + 'T00:00:00Z')) / 86400000);

function toast(msg, ms = 2800) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}
function daysAgo(ts) {
  const n = Math.floor((Date.now() - new Date(ts)) / 86400000);
  return n <= 0 ? 'hôm nay' : n + ' ngày';
}
const state = { view: 'pipeline', q: '', job: '', showClosed: false, drag: null,
  stages: [], jobs: [], candidates: [], employees: [], contracts: [], obItems: [], obTemplates: [], reviews: [],
  templates: [], offers: [], emails: [], me: '', resend: null,
  role: 'staff', roleKey: 'staff', myEmp: null, profiles: [], leaveTypes: [], leaves: [], balances: [], notifs: [],
  roles: [], rolePerms: [] };

/* ---------- generic form engine ---------- */
function fieldsHTML(spec, v = {}, p = 'f') {
  return spec.map(f => {
    const id = `${p}_${f.k}`, val = v[f.k] ?? '';
    let input;
    if (f.type === 'select') {
      input = `<select id="${id}">` + f.opts.map(o =>
        `<option value="${esc(o[0])}" ${String(val) === String(o[0]) ? 'selected' : ''}>${esc(o[1])}</option>`).join('') + '</select>';
    } else if (f.type === 'textarea') {
      input = `<textarea id="${id}" rows="${f.rows || 4}" placeholder="${esc(f.hint || '')}">${esc(val)}</textarea>`;
    } else {
      input = `<input id="${id}" type="${f.type || 'text'}" ${f.step ? `step="${f.step}"` : ''} value="${esc(val)}" placeholder="${esc(f.hint || '')}">`;
    }
    return `<div class="field"${f.wide ? ' style="grid-column:1/-1"' : ''}><label>${esc(f.label)}</label>${input}</div>`;
  }).join('');
}
function readFields(spec, p = 'f') {
  const o = {};
  for (const f of spec) {
    const el = $(`${p}_${f.k}`);
    if (!el) { console.warn('readFields: thiếu ô ' + p + '_' + f.k); o[f.k] = null; continue; }
    let v = el.value.trim();
    if (f.type === 'number') o[f.k] = v === '' ? null : Number(v);
    else o[f.k] = v === '' ? null : v;
  }
  return o;
}
function formModal(title, spec, values, onSave) {
  openModal(title, `<div class="row2">${fieldsHTML(spec, values, 'm')}</div>
    <div class="actions"><button class="btn" id="fCancel">Huỷ</button><button class="btn primary" id="fSave">Lưu</button></div>`);
  $('fCancel').onclick = closeAll;
  $('fSave').onclick = async () => {
    const b = $('fSave'); if (b.disabled) return;
    b.disabled = true;
    try { await onSave(readFields(spec, 'm')); } finally { const n = $('fSave'); if (n) n.disabled = false; }
  };
}
/* ---------- chặn thao tác theo ma trận quyền (DB vẫn là hàng rào cuối) ---------- */
const TABLE_MODULE = {
  candidates: 'candidates', candidate_events: 'candidates', jobs: 'jobs', offers: 'offers',
  employees: 'employees', employee_private: 'employees', employee_documents: 'employees',
  contracts: 'contracts', leave_requests: 'leave', leave_balances: 'leave',
  onboarding_items: 'onboarding', onboarding_templates: 'onboarding', probation_reviews: 'probation',
  email_templates: 'mail', email_log: 'mail', backups: 'backups',
  roles: 'settings', role_perms: 'settings', profiles: 'settings', stages: 'settings'
};
function guard(module, action) {
  if (perm(module, action)) return true;
  const ml = (PERM_MODULES.find(m => m[0] === module) || [0, module])[1];
  const al = (PERM_ACTIONS.find(a => a[0] === action) || [0, action])[1];
  toast(`Vai trò "${roleLabel(state.roleKey)}" không có quyền ${al.toLowerCase()} ở nhóm "${ml}"`, 6000);
  return false;
}
const guardTable = (table, action) => guard(TABLE_MODULE[table] || 'settings', action);

async function upsert(table, payload, id) {
  if (!guardTable(table, id ? 'edit' : 'create')) return false;
  const r = id ? await sb.from(table).update(payload).eq('id', id) : await sb.from(table).insert(payload);
  if (r.error) { toast('Lỗi lưu: ' + r.error.message, 6000); return false; }
  await loadAll(); render(); return true;
}
async function removeRow(table, id, label) {
  if (!guardTable(table, 'delete')) return;
  if (!confirm('Xoá ' + label + '? Không khôi phục được.')) return;
  const r = await sb.from(table).delete().eq('id', id);
  if (r.error) return toast('Lỗi xoá: ' + r.error.message, 6000);
  closeAll(); await loadAll(); render(); toast('Đã xoá');
}

/* ---------- overlays ---------- */
function closeAll() {
  $('drawer').classList.remove('on'); $('modal').classList.remove('on'); $('scrim').classList.remove('on');
  $('mBody').innerHTML = ''; $('dBody').innerHTML = '';
}
function openModal(title, html) { $('mTitle').textContent = title; $('mBody').innerHTML = html; $('modal').classList.add('on'); $('scrim').classList.add('on'); }
function openDrawer(title, html) { $('dName').textContent = title; $('dBody').innerHTML = html; $('drawer').classList.add('on'); $('scrim').classList.add('on'); }
$('scrim').onclick = closeAll; $('dClose').onclick = closeAll;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

/* ---------- auth ---------- */
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('loginEmail').value.trim();
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href.split('#')[0] } });
  if (!error) { $('loginMsg').textContent = 'Đã gửi link tới ' + email + '. Mở mail và bấm vào link.'; return; }
  const m = error.message || '';

  return { bg: `rgb(${g},${g},${g})`, fg: p > 0.45 ? '#fff' : '#000' };
}

$('cvFile').onchange = async (e) => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  toast('Đang đọc ' + file.name + '...', 9000);
  let text = '';
  try { text = await extractText(file); } catch (err) { console.error(err); }
  if (!text.trim()) { toast('Không đọc được nội dung CV, nhập tay giúp bạn nhé', 5000); return openAddCandidate({}, { file }); }
  let fields = {};
  try {
    const { data, error } = await sb.functions.invoke('parse-cv', { body: { text, filename: file.name } });
    if (error) throw error;
    if (data?.not_a_cv) toast('File này giống mô tả công việc hơn là CV — kiểm tra lại giúp bạn nhé', 6000);
    fields = data?.candidate || {};
    toast('Đã rút thông tin bằng ' + (data?.engine === 'ai' ? 'AI' : 'quy tắc') + ', kiểm tra lại trước khi lưu', 5000);
  } catch (err) { toast('Parse lỗi (' + err.message + '), điền tay giúp bạn nhé', 6000); }
  openAddCandidate(fields, { file, text });
};
async function extractText(file) {
  const n = file.name.toLowerCase();
  if (n.endsWith('.txt')) return await file.text();
  if (n.endsWith('.docx')) {
    const mammoth = await import('https://esm.sh/mammoth@1.13.0');
    return (await (mammoth.default || mammoth).extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
  }
  if (n.endsWith('.pdf')) {
    const pdfjs = await import('https://esm.sh/pdfjs-dist@6.4.299/build/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = 'https://esm.sh/pdfjs-dist@6.4.299/build/pdf.worker.min.mjs';
    const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
    let out = '';
    for (let p = 1; p <= Math.min(doc.numPages, 8); p++) {
      const tc = await (await doc.getPage(p)).getTextContent();
      out += tc.items.map(i => i.str).join(' ') + '\n';
    }
    return out;
  }
  return '';
}

/* =================== 4. SƠ ĐỒ TỔ CHỨC =================== */
function viewOrg() {
  $('toolbar').innerHTML = `<span class="meta">Sơ đồ dựng tự động từ cột "Quản lý trực tiếp" trong Danh bạ nhân sự.</span>${xlsxBar('employees')}`;
  const active = state.employees.filter(e => e.status !== 'left');
  const kids = (pid) => active.filter(e => (e.manager_id || null) === pid);
  const seen = new Set();
  const node = (e) => {
    if (seen.has(e.id)) return `<li><div class="node"><b>${esc(e.full_name)}</b><span>vòng lặp quản lý — kiểm tra lại</span></div></li>`;
    seen.add(e.id);
    const ch = kids(e.id);
    return `<li><div class="node"><b>${esc(e.full_name)}</b><span>${esc([e.title, e.level, e.department, e.business_unit].filter(Boolean).join(' · '))}</span></div>
      ${ch.length ? `<ul>${ch.map(node).join('')}</ul>` : ''}</li>`;
  };
  const roots = kids(null);
  const orphans = active.filter(e => e.manager_id && !active.some(m => m.id === e.manager_id));
  $('view').innerHTML = (roots.length || orphans.length)
    ? `<div class="org"><ul>${roots.concat(orphans).map(node).join('')}</ul></div>`
    : '<div class="empty">Chưa có nhân sự, hoặc mọi người đều có quản lý (vòng lặp). Thêm nhân sự ở tab Danh bạ.</div>';
}

/* =================== 5. ONBOARDING =================== */
function probDue(e) {
  const c = state.contracts.filter(x => x.employee_id === e.id && x.type === 'thu_viec' && x.end_date)
    .sort((a, b) => String(b.start_date || '').localeCompare(String(a.start_date || '')))[0];
  if (c) return c.end_date;
  return e.start_date ? addDays(e.start_date, 60) : null;
}
function obStat(empId) {
  const items = state.obItems.filter(i => i.employee_id === empId);
  const done = items.filter(i => i.done).length;
  const late = items.filter(i => !i.done && i.due_date && dayDiff(i.due_date) < 0).length;
  return { items, done, late, complete: items.length > 0 && done === items.length };
}
function lastReview(empId) {
  return state.reviews.filter(r => r.employee_id === empId)
    .sort((a, b) => String(b.review_date || '').localeCompare(String(a.review_date || '')))[0];
}
async function confirmProbation(empId) {
  if (!guard('probation', 'approve')) return;
  const e = state.employees.find(x => x.id === empId); if (!e) return;
  const st = obStat(empId);
  if (!st.complete) return toast('Checklist onboarding chưa xong', 4000);
  const r = lastReview(empId);
  if (!r) return toast('Chưa có đánh giá thử việc', 4000);
  if (r.result !== 'pass') return toast('Đánh giá chưa đạt — chưa chuyển nhóm được', 5000);
  if (!confirm(`Xác nhận ${e.full_name} hoàn tất thử việc và chuyển sang Hồ sơ nhân sự?`)) return;
  const { data: { user } } = await sb.auth.getUser();
  await sb.from('probation_reviews').update({ confirmed_by: user.id, confirmed_at: new Date().toISOString() }).eq('id', r.id);
  if (await upsert('employees', { status: 'active' }, empId)) toast('Đã chuyển sang Hồ sơ nhân sự');
}

  $('view').innerHTML = `

    ${rows.length ? `<div class="cards">${rows.map(e => {
      const st = obStat(e.id), due = probDue(e), last = lastReview(e.id);
      const pct = st.items.length ? Math.round(st.done / st.items.length * 100) : 0;
      const canConfirm = st.complete && last && last.result === 'pass' && perm('probation', 'approve');
      return `<div class="panel">
        <h4>${esc(e.full_name)}</h4>
        <div class="meta">${esc([e.title, e.level, e.department, e.business_unit].filter(Boolean).join(' · '))}${e.start_date ? ' · vào ' + d(e.start_date) : ''}</div>
        ${st.items.length ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}
        <div class="tags" style="margin-top:8px">
          ${st.items.length
            ? (st.complete
                ? '<span class="tag ok">✓ Onboarding xong</span>'
                : `<span class="tag">☐ Onboarding ${st.done}/${st.items.length}</span>`)
            : '<span class="tag soon">☐ Chưa có checklist</span>'}
          ${st.late ? `<span class="tag warn">⚠ ${st.late} quá hạn</span>` : ''}
          ${st.complete && due ? `<span class="tag ${dayDiff(due) < 0 ? 'warn' : 'soon'}">⏱ Thử việc · hạn ${d(due)}</span>` : ''}
          ${st.complete ? (last
            ? `<span class="tag ${last.result === 'pass' ? 'ok' : ''}">${last.total ?? '-'}/5 · ${esc(RESULT_LABEL[last.result] || 'chưa kết luận')}</span>`
            : '<span class="tag">chưa đánh giá</span>') : ''}
        </div>
        <div class="actions" style="justify-content:flex-start;margin-top:10px">
          <button class="btn sm" data-nh-ob="${e.id}">Checklist</button>

          <button class="btn sm" data-nh-emp="${e.id}">Hồ sơ</button>
          ${canConfirm ? `<button class="btn sm primary" data-nh-ok="${e.id}">Xác nhận hoàn tất</button>` : ''}
        </div></div>`; }).join('')}</div>`
      : '<div class="empty">Không có nhân sự mới nào đang thử việc.</div>'}
    <h2 class="sec" style="margin-top:22px">Lịch sử đánh giá (${state.reviews.length})</h2>
    ${state.reviews.length ? `<table class="grid"><thead><tr><th>Nhân sự</th><th>Ngày</th><th>Người đánh giá</th><th>Điểm</th><th>Kết luận</th><th>Xác nhận</th></tr></thead>
      <tbody>${state.reviews.map(r => `<tr data-rev="${r.id}">
        <td><b>${esc(empName(r.employee_id))}</b></td><td>${d(r.review_date)}</td><td>${esc(r.reviewer)}</td>
        <td>${r.total ?? '-'}/5</td><td>${esc(RESULT_LABEL[r.result] || '')}</td>
        <td>${r.confirmed_at ? `<span class="tag ok">✓ ${d(r.confirmed_at)}</span>` : '<span class="meta">chưa</span>'}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">Chưa có đánh giá nào.</div>'}`;
  document.querySelectorAll('[data-nh-ob]').forEach(b => b.onclick = () => openOnboarding(b.dataset.nhOb));
  document.querySelectorAll('[data-nh-rev]').forEach(b => b.onclick = () => openReviewForm(null, b.dataset.nhRev));
  document.querySelectorAll('[data-nh-emp]').forEach(b => b.onclick = () => openEmployee(b.dataset.nhEmp));
  document.querySelectorAll('[data-nh-ok]').forEach(b => b.onclick = () => confirmProbation(b.dataset.nhOk));
  document.querySelectorAll('[data-rev]').forEach(tr => tr.onclick = () => openReviewForm(tr.dataset.rev));
}
function openOnboarding(empId) {
  const e = state.employees.find(x => x.id === empId); if (!e) return;
  const items = state.obItems.filter(i => i.employee_id === empId).sort((a, b) => a.sort_order - b.sort_order);
  openDrawer('Onboarding — ' + e.full_name, `
    ${items.length ? `<ul class="checklist">${items.map(i => `<li class="${i.done ? 'done' : ''}">
        <input type="checkbox" data-item="${i.id}" ${i.done ? 'checked' : ''}>
        <div style="flex:1"><span class="t">${esc(i.title)}</span>
          <div class="meta">${esc(i.owner_role || '')}${i.due_date ? ' · hạn ' + d(i.due_date) : ''}${!i.done && i.due_date && dayDiff(i.due_date) < 0 ? ' · quá hạn' : ''}</div></div>
      </li>`).join('')}</ul>
      <div class="actions" style="margin-top:14px"><button class="btn danger" id="obClear">Xoá checklist</button></div>`
    : `<p class="empty">Chưa có checklist. Chọn mẫu để tạo:</p>
       <div class="field"><label>Mẫu</label><select id="obTpl">${state.obTemplates.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>
       <div class="field"><label>Mốc ngày bắt đầu</label><input type="date" id="obStart" value="${e.start_date || today()}"></div>
       <div class="actions"><button class="btn primary" id="obApply">Áp dụng mẫu</button></div>`}`);
  document.querySelectorAll('[data-item]').forEach(cb => cb.onchange = async () => {
    if (!guard('onboarding', 'edit')) { cb.checked = !cb.checked; return; }
    const r = await sb.from('onboarding_items').update({ done: cb.checked, done_at: cb.checked ? new Date().toISOString() : null }).eq('id', cb.dataset.item);
    if (r.error) { cb.checked = !cb.checked; return toast('Lỗi: ' + r.error.message, 6000); }
    await loadAll(); openOnboarding(empId); render();
  });
  const ap = $('obApply');
  if (ap) ap.onclick = async () => {
    if (!guard('onboarding', 'create')) return;
    const tpl = state.obTemplates.find(t => t.id === $('obTpl').value);
    const base = $('obStart').value || today();
    const rows = (tpl.onboarding_template_items || []).sort((a, b) => a.sort_order - b.sort_order).map(it => ({
      employee_id: empId, title: it.title, owner_role: it.owner_role,
      due_date: addDays(base, it.day_offset), sort_order: it.sort_order
    }));
    if (!rows.length) return toast('Mẫu này chưa có việc nào');
    const { error } = await sb.from('onboarding_items').insert(rows);
    if (error) return toast('Lỗi: ' + error.message, 6000);
    await loadAll(); openOnboarding(empId); render(); toast('Đã tạo ' + rows.length + ' việc');
  };
  const cl = $('obClear');
  if (cl) cl.onclick = async () => {
    if (!guard('onboarding', 'delete')) return;
    if (!confirm('Xoá toàn bộ checklist của ' + e.full_name + '?')) return;
    const { error } = await sb.from('onboarding_items').delete().eq('employee_id', empId);
    if (error) return toast('Lỗi: ' + error.message, 6000);
    await loadAll(); openOnboarding(empId); render(); toast('Đã xoá checklist');
  };
}

/* --- chuyển đổi giá trị --- */
const low = (v) => String(v ?? '').trim().toLowerCase();
/* Ô định dạng Số làm mất số 0 đứng đầu (0901234567 -> 901234567).
   Ưu tiên chuỗi Excel hiển thị; nếu file đã mất hẳn thì vá lại số di động VN. */
function xlText(col, raw, shown) {
  let out = String(raw ?? '').trim();
  const dsp = String(shown ?? '').trim();
  if (dsp && /^\d+$/.test(out) && /^0\d/.test(dsp.replace(/[\s.()\-]/g, ''))) out = dsp;
  if (col.k !== 'phone') return out;
  const dg = out.replace(/[^\d+]/g, '');
  if (/^84\d{9}$/.test(dg)) return '0' + dg.slice(2);
  if (/^\+84\d{9}$/.test(dg)) return '0' + dg.slice(3);
  if (/^[35789]\d{8}$/.test(dg)) return '0' + dg;   // mất số 0 đầu
  return dg || out;
}
const normH = (h) => String(h ?? '').toLowerCase().replace(/\(.*?\)/g, '').replace(/[*:]/g, '').replace(/\s+/g, ' ').trim();
function xlDate(v) {
  if (v == null || v === '') return null;
  // dùng toString thay vì instanceof: ô ngày từ file Excel có thể thuộc realm khác (iframe)
  if (Object.prototype.toString.call(v) === '[object Date]') {
    if (isNaN(v.getTime())) return undefined;
    return new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }
  if (typeof v === 'number') return new Date(Date.UTC(1899, 11, 30) + v * 86400000).toISOString().slice(0, 10);
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  return undefined;
}
function xlNum(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return Number.isFinite(v) ? v : undefined;
  const raw = String(v).trim();
  if (!/\d/.test(raw)) return undefined;                       // "abc" không được thành 0
  let t = raw.replace(/\b(vnd|vnđ|đ)\b/gi, '').replace(/[₫$]/g, '').trim();
  if (/[A-Za-zÀ-ỹ]/.test(t)) return undefined;                  // "15 triệu" phải báo lỗi, không đoán bừa
  t = t.replace(/\s/g, '').replace(/\.(?=\d{3}\b)/g, '').replace(/,(?=\d{3}\b)/g, '').replace(',', '.');
  const n = Number(t);
  return Number.isFinite(n) ? n : undefined;
}
const xlBool = (v) => v == null || v === '' ? undefined : /^(có|co|x|yes|true|1|đang tuyển)$/i.test(String(v).trim());
function cellOut(col, row) {
  const v = row[col.k];
  if (col.lookup === 'employee') return empName(v);
  if (col.lookup === 'job') return jobName(v);
  if (col.list) return (v || []).join(', ');
  if (col.bool) return v ? 'Có' : 'Không';
  if (col.stage) return state.stages.find(s => s.key === v)?.label || v || '';
  if (col.map) return Object.keys(col.map).find(k => col.map[k] === v) || '';
  return v ?? '';
}
function cellIn(col, raw, rowErrors, shown) {
  const v = typeof raw === 'string' ? raw.trim() : raw;
  const empty = v == null || v === '';
  if (empty) {
    if (col.req) { rowErrors.push(`thiếu "${col.h}"`); return undefined; }
    return undefined; // ô trống: không ghi đè dữ liệu đang có, để DB tự áp mặc định khi thêm mới
  }
  if (col.lookup === 'employee') return pickOne(state.employees, 'full_name', 'employee_code', v, 'nhân sự', rowErrors);
  if (col.lookup === 'job') return pickOne(state.jobs, 'title', 'department', v, 'vị trí', rowErrors);
  if (col.stage) {
    const st = state.stages.find(s => s.key === String(v).toLowerCase() || s.label.toLowerCase() === String(v).toLowerCase());
    if (!st) { rowErrors.push(`vòng "${v}" không hợp lệ`); return undefined; }
    return st.key;
  }
  if (col.map) {
    const codes = Object.values(col.map);
    if (codes.includes(String(v))) return String(v);
    const hit = Object.keys(col.map).find(k => k.toLowerCase() === String(v).toLowerCase());
    if (!hit) { rowErrors.push(`"${col.h}" chỉ nhận: ${Object.keys(col.map).join(' / ')}`); return undefined; }
    return col.map[hit];
  }
  if (col.enum) {
    const hit = col.enum.find(x => x.toLowerCase() === String(v).toLowerCase());
    if (!hit) { rowErrors.push(`"${col.h}" chỉ nhận: ${col.enum.join(' / ')}`); return undefined; }
    return hit;
  }
  if (col.bool) { const b = xlBool(v); return b === undefined ? true : b; }
  if (col.date) { const d = xlDate(v); if (d === undefined) { rowErrors.push(`ngày "${v}" sai định dạng, cần yyyy-mm-dd`); return undefined; } return d; }
  if (col.num) { const n = xlNum(v); if (n === undefined) { rowErrors.push(`"${col.h}" phải là số, đang là "${v}"`); return undefined; } return n; }
  if (col.list) return String(v).split(',').map(x => x.trim()).filter(Boolean);
  if (col.text) return xlText(col, v, shown);
  return String(v);
}
/* Tra cứu theo tên: trùng tên thì báo lỗi thay vì âm thầm lấy dòng đầu.
   Cho phép ghi "Tên (phân biệt)" — mã nhân viên hoặc phòng ban — để tách. */
function pickOne(list, nameKey, tieKey, v, what, rowErrors) {
  const raw = String(v).trim();
  const m = raw.match(/^(.*?)\s*[(\[]([^)\]]+)[)\]]\s*$/);
  const name = low(m ? m[1] : raw), tie = m ? low(m[2]) : null;
  let hits = list.filter(x => low(x[nameKey]) === name);
  if (tie) hits = hits.filter(x => low(x[tieKey]) === tie);
  if (!hits.length) { rowErrors.push(`không tìm thấy ${what} "${raw}"`); return undefined; }
  if (hits.length > 1) {
    const opts = hits.map(x => x[tieKey]).filter(Boolean).join(' / ') || 'không có dữ liệu phân biệt';
    rowErrors.push(`có ${hits.length} ${what} trùng tên "${raw}" — ghi rõ dạng "${raw} (${hits[0][tieKey] || '...'})". Đang có: ${opts}`);
    return undefined;
  }
  return hits[0].id;
}
/* đọc mảng 2 chiều từ Excel → danh sách bản ghi + lỗi theo dòng */
function parseAoa(entity, aoa, shownAoa) {
  const cfg = SHEETS[entity], headers = (aoa[0] || []).map(normH);
  const idx = {};
  cfg.cols.forEach(c => { const i = headers.indexOf(normH(c.h)); if (i >= 0) idx[c.k] = i; });
  const missing = cfg.cols.filter(c => c.req && idx[c.k] === undefined).map(c => c.h);
  const rows = [], errors = [];
  if (missing.length) return { rows, errors: [{ line: 1, msgs: ['thiếu cột bắt buộc: ' + missing.join(', ')] }], missing };
  aoa.slice(1).forEach((r, n) => {
    if (!r || r.every(c => c == null || String(c).trim() === '')) return;
    const msgs = [], out = {};
    cfg.cols.forEach(c => {
      if (idx[c.k] === undefined) return; // cột không có trong file: giữ nguyên giá trị cũ
      const v = cellIn(c, r[idx[c.k]], msgs, ((shownAoa || [])[n + 1] || [])[idx[c.k]]);
      if (v !== undefined) out[c.k] = v;
    });
    if (msgs.length) errors.push({ line: n + 2, msgs });
    else rows.push(out);
  });
  return { rows, errors, missing };
}
async function exportSheet(entity) {
  const XLSX = await loadXLSX();
  const cfg = SHEETS[entity];
  const data = cfg.rows().map(r => Object.fromEntries(cfg.cols.map(c => [c.h.replace(' *', ''), cellOut(c, r)])));
  if (!data.length) return toast('Chưa có dữ liệu để xuất');
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = cfg.cols.map(c => ({ wch: Math.max(14, Math.min(38, c.h.length + 6)) }));

async function templateSheet(entity) {
  const XLSX = await loadXLSX();
  const cfg = SHEETS[entity];
  const ws = XLSX.utils.aoa_to_sheet([cfg.cols.map(c => c.h), cfg.sample || []]);
  ws['!cols'] = cfg.cols.map(c => ({ wch: Math.max(14, Math.min(38, c.h.length + 6)) }));
  const guide = [['Hướng dẫn nhập liệu'], ['Cột có dấu * là bắt buộc.'], ['Ngày ghi dạng yyyy-mm-dd hoặc dd/mm/yyyy.'],
    ['Dòng mẫu ở sheet đầu chỉ để tham khảo — xoá đi trước khi nhập.'], ['Giá trị cho phép:'], []];
  cfg.cols.forEach(c => {
    if (c.map) guide.push([c.h, Object.keys(c.map).join(' / ')]);
    else if (c.enum) guide.push([c.h, c.enum.join(' / ')]);
    else if (c.bool) guide.push([c.h, 'Có / Không']);
    else if (c.stage) guide.push([c.h, state.stages.map(s => s.label).join(' / ')]);
    else if (c.lookup) guide.push([c.h, 'phải trùng tên đã có trong app']);
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Nhap lieu');
  const gs = XLSX.utils.aoa_to_sheet(guide); gs['!cols'] = [{ wch: 34 }, { wch: 60 }];
  XLSX.utils.book_append_sheet(wb, gs, 'Huong dan');

  toast('Đã tải file mẫu');
}
function pickImport(entity) {

async function previewImport(entity, file) {
  const cfg = SHEETS[entity];
  let parsed;
  try {
    const XLSX = await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    // bản thứ 2 theo đúng chuỗi Excel hiển thị — dùng cho cột text để không mất số 0 đầu
    const shownAoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
    parsed = parseAoa(entity, aoa, shownAoa);
  } catch (e) { return toast('Không đọc được file: ' + e.message, 6000); }
  const { rows, errors } = parsed;
  const keyOf = cfg.keyOf;
  const existing = keyOf ? (cfg.rows() || []) : [];
  const existKeys = new Set(existing.map(e => keyOf(e)).filter(Boolean));
  const dup = keyOf ? rows.filter(r => keyOf(r) && existKeys.has(keyOf(r))) : [];
  openModal(`Nhập dữ liệu — ${cfg.label}`, `
    <p><b>${rows.length}</b> dòng hợp lệ · <b style="color:var(--danger)">${errors.length}</b> dòng lỗi${dup.length ? ` · <b>${dup.length}</b> dòng trùng theo ${cfg.keyLabel} sẽ được cập nhật thay vì tạo mới` : ''}</p>
    ${errors.length ? `<div class="panel" style="max-height:200px;overflow:auto;margin-bottom:12px">
      ${errors.slice(0, 50).map(e => `<div class="meta">Dòng ${e.line}: ${esc(e.msgs.join('; '))}</div>`).join('')}
      ${errors.length > 50 ? `<div class="meta">... và ${errors.length - 50} dòng nữa</div>` : ''}</div>` : ''}
    ${rows.length ? `<table class="grid"><thead><tr>${cfg.cols.slice(0, 5).map(c => `<th>${esc(c.h.replace(' *', ''))}</th>`).join('')}</tr></thead>
      <tbody>${rows.slice(0, 5).map(r => `<tr>${cfg.cols.slice(0, 5).map(c => `<td>${esc(String(cellOut(c, r) ?? ''))}</td>`).join('')}</tr>`).join('')}</tbody></table>
      <div class="meta" style="margin-top:6px">Xem trước 5 dòng đầu.</div>` : ''}
    <div class="actions"><button class="btn" id="imCancel">Huỷ</button>
      <button class="btn primary" id="imGo" ${rows.length ? '' : 'disabled'}>Nhập ${rows.length} dòng</button></div>`);
  $('imCancel').onclick = closeAll;
  $('imGo').onclick = async () => {
    if (!guardTable(cfg.table, 'create') || !guardTable(cfg.table, 'edit')) return;
    $('imGo').disabled = true;
    const defaults = Object.fromEntries(cfg.cols.filter(c => c.def !== undefined).map(c => [c.k, c.def]));
    const seen = new Map(existing.map(e => [keyOf ? keyOf(e) : '', e.id]).filter(([k]) => k));
    let ins = 0, upd = 0;
    for (const r of rows) {
      const k = keyOf ? (keyOf(r) || null) : null;
      const matchId = k ? seen.get(k) : null;
      const res = matchId
        ? await sb.from(cfg.table).update(r).eq('id', matchId)               // chỉ ghi cột có trong file
        : await sb.from(cfg.table).insert({ ...defaults, ...r }).select('id').single();
      if (res.error) {
        toast(`Dừng ở dòng "${r.full_name || r.title || ''}": ${res.error.message} — ${ins} dòng đã thêm, ${upd} đã cập nhật. Xoá các dòng này khỏi file trước khi nhập lại.`, 12000);
        $('imGo').disabled = false; await loadAll(); render(); return;
      }
      if (matchId) upd++; else { ins++; if (k && res.data?.id) seen.set(k, res.data.id); } // chặn trùng trong cùng file
    }
    closeAll(); await loadAll(); render();
    toast(`Đã nhập: ${ins} dòng mới${upd ? `, cập nhật ${upd} dòng` : ''}`);
  };
}

function workDays(a, b) {
  let n = 0; const x = new Date(a), y = new Date(b);
  for (let dte = new Date(x); dte <= y; dte.setDate(dte.getDate() + 1)) {
    const w = dte.getDay(); if (w !== 0 && w !== 6) n++;
  }
  return n;
}

async function decideLeave(id, status) {
  if (!guard('leave', 'approve')) return;
  let note = null;
  if (status === 'rejected') {
    note = prompt('Lý do từ chối (không bắt buộc):');
    if (note === null) return; // người dùng bấm Huỷ

  const { data, error } = await sb.from('leave_requests').update({
    status, decided_at: new Date().toISOString(), approver_name: state.me, decision_note: note
  }).eq('id', id).eq('status', 'pending').select('id');

function leaveForm(id) {
  const l = id ? state.leaves.find(x => x.id === id) : null;
  const canPickEmp = isHR();
  const spec = [
    ...(canPickEmp ? [{ k: 'employee_id', label: 'Nhân sự *', type: 'select', opts: [['', '— chọn —'], ...state.employees.filter(e => e.status !== 'left').map(e => [e.id, e.full_name])] }] : []),
    { k: 'type_key', label: 'Loại nghỉ', type: 'select', opts: state.leaveTypes.map(t => [t.key, t.label]) },
    { k: 'start_date', label: 'Từ ngày *', type: 'date' },
    { k: 'end_date', label: 'Đến ngày *', type: 'date' },
    { k: 'days', label: 'Số ngày (tự tính, sửa được)', type: 'number', step: '0.5' },
    { k: 'reason', label: 'Lý do', type: 'textarea', wide: true, rows: 3 },
    ...(isHR() && id ? [{ k: 'status', label: 'Trạng thái', type: 'select', opts: Object.entries(LEAVE_STATUS) }] : [])
  ];
  const values = l || { employee_id: state.myEmp || '', type_key: 'annual', start_date: today(), end_date: today(), days: 1, status: 'pending' };
  formModal(id ? 'Sửa đơn nghỉ' : 'Tạo đơn nghỉ', spec, values, async (o) => {
    const payload = { ...o, employee_id: canPickEmp ? o.employee_id : state.myEmp };
    if (!canPickEmp) payload.status = 'pending'; // sửa đơn là phải duyệt lại
    if (!payload.employee_id) return toast('Chưa gắn hồ sơ nhân sự cho tài khoản này');
    if (!payload.start_date || !payload.end_date) return toast('Chọn ngày bắt đầu và kết thúc');
    if (new Date(payload.end_date) < new Date(payload.start_date)) return toast('Ngày kết thúc phải sau ngày bắt đầu');
    if (!payload.days) payload.days = workDays(payload.start_date, payload.end_date);
    if (await upsert('leave_requests', payload, id)) { closeAll(); toast(id ? 'Đã cập nhật đơn' : 'Đã gửi đơn nghỉ, chờ duyệt'); }
  });
  const sd = $('m_start_date'), ed = $('m_end_date'), dd = $('m_days');
  if (sd && ed && dd) {
    const recalc = () => { if (sd.value && ed.value && new Date(ed.value) >= new Date(sd.value)) dd.value = workDays(sd.value, ed.value); };
    sd.onchange = recalc; ed.onchange = recalc;
  }
}

async function openEmployeeDocs(empId) {
  const e = state.employees.find(x => x.id === empId); if (!e) return;
  const [pv, dc] = await Promise.all([
    sb.from('employee_private').select('*').eq('employee_id', empId).maybeSingle(),
    sb.from('employee_documents').select('*').eq('employee_id', empId).order('uploaded_at', { ascending: false })
  ]);
  if (pv.error) return toast('Không đọc được hồ sơ cá nhân: ' + pv.error.message + ' — chưa mở form để tránh ghi đè', 8000);
  const priv = pv.data, docs = dc.data;
  openDrawer('Hồ sơ & giấy tờ — ' + e.full_name, `
    <div class="row2">${fieldsHTML(PRIVATE_SPEC, priv || {}, 'pv')}</div>
    <div class="actions"><button class="btn primary" id="pvSave">Lưu hồ sơ</button></div>
    <h4 style="margin:18px 0 8px">Giấy tờ đính kèm (${(docs || []).length})</h4>
    <div class="row2">
      <div class="field"><label>Loại giấy tờ</label><select id="docType">${DOC_TYPES.map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
      <div class="field"><label>Hạn hiệu lực (nếu có)</label><input type="date" id="docExp"></div>
    </div>
    <div class="actions"><button class="btn" id="docPick">Chọn file & tải lên</button></div>
    ${(docs || []).map(x => `<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">
      <span class="tag">${esc(DOC_TYPES.find(t => t[0] === x.doc_type)?.[1] || x.doc_type)}</span>
      <div style="flex:1"><b>${esc(x.file_name)}</b><div class="meta">${new Date(x.uploaded_at).toLocaleDateString('vi-VN')}${x.expires_on ? ' · hạn ' + d(x.expires_on) : ''}</div></div>
      <button class="btn sm" data-doc="${x.file_path}">Mở</button>
      <button class="btn sm danger" data-docdel="${x.id}">Xoá</button></div>`).join('') || '<div class="empty">Chưa có giấy tờ nào</div>'}`);
  $('pvSave').onclick = async () => {
    if (!guard('employees', 'edit')) return;
    const payload = { ...readFields(PRIVATE_SPEC, 'pv'), employee_id: empId };
    const { error } = await sb.from('employee_private').upsert(payload);
    if (error) return toast('Lỗi: ' + error.message, 6000);
    toast('Đã lưu hồ sơ cá nhân');
  };
  $('docPick').onclick = () => {
    if (!guard('employees', 'create')) return;
    const inp = document.createElement('input'); inp.type = 'file';
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      if (f.size > 15 * 1024 * 1024) return toast('File quá 15MB', 5000);
      const path = `${empId}/${Date.now()}-${f.name.replace(/[^\w.\-]+/g, '_')}`;
      const up = await sb.storage.from('hr-docs').upload(path, f);
      if (up.error) return toast('Upload lỗi: ' + up.error.message, 6000);
      const { error } = await sb.from('employee_documents').insert({
        employee_id: empId, doc_type: $('docType').value, file_path: path, file_name: f.name,
        expires_on: $('docExp').value || null
      });
      if (error) return toast('Lỗi: ' + error.message, 6000);
      openEmployeeDocs(empId); toast('Đã tải lên ' + f.name);
    };
    inp.click();
  };
  document.querySelectorAll('[data-doc]').forEach(b => b.onclick = async () => {
    const { data, error } = await sb.storage.from('hr-docs').createSignedUrl(b.dataset.doc, 300);
    if (error) return toast('Lỗi: ' + error.message, 6000);
    window.open(data.signedUrl, '_blank');
  });
  document.querySelectorAll('[data-docdel]').forEach(b => b.onclick = async () => {
    if (!guard('employees', 'delete')) return;
    if (!confirm('Xoá giấy tờ này?')) return;
    const row = (docs || []).find(x => x.id === b.dataset.docdel);
    const del = await sb.from('employee_documents').delete().eq('id', b.dataset.docdel).select('id');
    if (del.error) return toast('Lỗi xoá: ' + del.error.message, 6000);
    if (!del.data || !del.data.length) { openEmployeeDocs(empId); return toast('Không xoá được — thiếu quyền hoặc bản ghi đã bị xoá', 6000); }
    // xoá nốt file trong kho, nếu không file rác nằm lại mãi
    if (row?.file_path) {
      const rm = await sb.storage.from('hr-docs').remove([row.file_path]);
      if (rm.error) toast('Đã xoá bản ghi nhưng file còn trong kho: ' + rm.error.message, 7000);
    }
    openEmployeeDocs(empId); toast('Đã xoá');
  });
}

  $('view').insertAdjacentHTML('beforeend', `

    <div class="panel">
      <div class="meta">Mỗi vai trò dựa trên một <b>nhóm quyền gốc</b> (quyết định dữ liệu người đó đọc/ghi được ở tầng cơ sở dữ liệu),
      cộng với ma trận quyền thao tác bên dưới. Vai trò hệ thống không xoá được.</div>
      <div class="actions" style="justify-content:flex-start;margin:12px 0">
        <button class="btn primary" id="rolNew">+ Vai trò mới</button>
      </div>
      <table class="grid"><thead><tr><th>Vai trò</th><th>Mã</th><th>Nhóm quyền gốc</th><th>Đang dùng</th><th>Quyền bật</th><th></th></tr></thead>
        <tbody>${state.roles.map(r => {
          const on = state.rolePerms.filter(x => x.role_key === r.key && x.allowed).length;
          return `<tr>
            <td><b>${esc(r.label)}</b>${r.is_system ? ' <span class="tag">hệ thống</span>' : ''}</td>
            <td><span class="meta">${esc(r.key)}</span></td>
            <td>${esc((ROLE_BASES.find(b => b[0] === r.base) || [, r.base])[1])}</td>
            <td>${used(r.key)} tài khoản</td>
            <td>${on}/${PERM_MODULES.length * PERM_ACTIONS.length}</td>
            <td><button class="btn sm" data-rol-edit="${r.key}">Sửa quyền</button>
              ${r.is_system ? '' : `<button class="btn sm danger" data-rol-del="${r.key}">Xoá</button>`}</td>
          </tr>`; }).join('')}</tbody></table>
    </div>`);
  $('rolNew').onclick = () => formModal('Vai trò mới', [
    { k: 'label', label: 'Tên vai trò *' },
    { k: 'key', label: 'Mã (không dấu, không khoảng trắng) *' },
    { k: 'base', label: 'Nhóm quyền gốc *', type: 'select', opts: ROLE_BASES },
    { k: 'sort', label: 'Thứ tự hiển thị', type: 'number' }
  ], { base: 'staff', sort: 50 }, async o => {
    const key = String(o.key || '').trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
    if (!o.label || !key) return toast('Cần tên và mã vai trò');
    if (state.roles.some(r => r.key === key)) return toast('Mã vai trò đã tồn tại');
    const { error } = await sb.from('roles').insert({ key, label: o.label, base: o.base, sort: Number(o.sort) || 50 });
    if (error) return toast('Lỗi: ' + error.message, 6000);
    const rows = [];
    for (const [m] of PERM_MODULES) for (const [a] of PERM_ACTIONS) rows.push({ role_key: key, module: m, action: a, allowed: false });
    await sb.from('role_perms').insert(rows);
    closeAll(); await loadAll(); render(); toast('Đã tạo vai trò');
  });
  document.querySelectorAll('[data-rol-edit]').forEach(b => b.onclick = () => openRolePerms(b.dataset.rolEdit));
  document.querySelectorAll('[data-rol-del]').forEach(b => b.onclick = async () => {
    const k = b.dataset.rolDel;
    if (state.profiles.some(p => p.role === k)) return toast('Còn tài khoản đang dùng vai trò này', 5000);
    if (!confirm('Xoá vai trò "' + roleLabel(k) + '"? Không khôi phục được.')) return;
    const { error } = await sb.from('roles').delete().eq('key', k);
    if (error) return toast('Lỗi xoá: ' + error.message, 6000);
    await loadAll(); render(); toast('Đã xoá vai trò');
  });
}

function openRolePerms(key) {
  const r = state.roles.find(x => x.key === key); if (!r) return;
  const val = (m, a) => {
    const x = state.rolePerms.find(p => p.role_key === key && p.module === m && p.action === a);
    return !!(x && x.allowed);
  };
  const locked = r.key === 'admin';
  openDrawer('Quyền của vai trò — ' + r.label, `
    <div class="meta">Nhóm quyền gốc: <b>${esc((ROLE_BASES.find(b => b[0] === r.base) || [, r.base])[1])}</b>
      — quyết định phạm vi dữ liệu ở tầng cơ sở dữ liệu. Ma trận dưới đây quyết định thao tác trong app.</div>
    ${locked ? '<div class="meta" style="margin-top:8px"><b>Quản trị luôn có toàn quyền, không chỉnh được.</b></div>' : ''}
    <table class="grid" style="margin-top:12px"><thead><tr><th>Nhóm chức năng</th>
      ${PERM_ACTIONS.map(([, l]) => `<th style="text-align:center">${l}</th>`).join('')}</tr></thead>
      <tbody>${PERM_MODULES.map(([m, ml]) => `<tr><td><b>${ml}</b></td>
        ${PERM_ACTIONS.map(([a]) => `<td style="text-align:center">
          <input type="checkbox" data-pm="${m}" data-pa="${a}" ${val(m, a) ? 'checked' : ''} ${locked ? 'disabled' : ''}></td>`).join('')}
      </tr>`).join('')}</tbody></table>
    ${locked ? '' : `<div class="actions" style="margin-top:14px">
      <button class="btn" id="rpAllOff">Bỏ chọn hết</button>
      <button class="btn" id="rpAllOn">Chọn hết</button>
      <button class="btn primary" id="rpSave">Lưu quyền</button></div>`}`);
  if (locked) return;
  $('rpAllOn').onclick = () => document.querySelectorAll('[data-pm]').forEach(c => c.checked = true);
  $('rpAllOff').onclick = () => document.querySelectorAll('[data-pm]').forEach(c => c.checked = false);
  $('rpSave').onclick = async () => {
    const rows = [...document.querySelectorAll('[data-pm]')].map(c => ({
      role_key: key, module: c.dataset.pm, action: c.dataset.pa, allowed: c.checked
    }));
    const { error } = await sb.from('role_perms').upsert(rows, { onConflict: 'role_key,module,action' });
    if (error) return toast('Lỗi lưu quyền: ' + error.message, 6000);
    closeAll(); await loadAll(); render(); toast('Đã lưu quyền vai trò');
  };
}

async function renderBackupPanel() {
  if (!isHR()) return;
  const token = state.view;
  const { data: snaps } = await sb.from('backups').select('slot, taken_at, row_counts').order('taken_at', { ascending: false }).limit(10);
  const rows = snaps || [];
  const total = (rc) => Object.values(rc || {}).reduce((a, b) => a + Number(b), 0);
  if (state.view !== token || $('bkNow')) return; // đã đổi tab, hoặc panel đã có
  $('view').insertAdjacentHTML('beforeend', `
    <h2 class="sec" style="margin-top:22px">Sao lưu dữ liệu</h2>
    <div class="panel">
      <div class="meta">Hệ thống tự chụp toàn bộ dữ liệu mỗi ngày lúc 2h10 sáng và giữ 31 bản gần nhất (mỗi ngày trong tháng một bản).
      Bấm "Tải về" để giữ thêm một bản ngoài hệ thống — nên làm mỗi tháng một lần.</div>
      <div class="actions" style="justify-content:flex-start;margin:12px 0">
        <button class="btn" id="bkNow">Chụp bản sao lưu ngay</button>
        <button class="btn primary" id="bkDown" ${rows.length ? '' : 'disabled'}>Tải bản mới nhất (.json)</button>
      </div>
      ${rows.length ? `<table class="grid"><thead><tr><th>Thời điểm</th><th>Tổng số dòng</th><th>Nhân sự</th><th>Ứng viên</th><th>Hợp đồng</th></tr></thead>
        <tbody>${rows.map(b => `<tr><td>${new Date(b.taken_at).toLocaleString('vi-VN')}</td><td>${total(b.row_counts)}</td>
          <td>${b.row_counts?.employees ?? 0}</td><td>${b.row_counts?.candidates ?? 0}</td><td>${b.row_counts?.contracts ?? 0}</td></tr>`).join('')}</tbody></table>`
        : '<div class="empty">Chưa có bản sao lưu nào — bấm "Chụp bản sao lưu ngay".</div>'}
    </div>`);
  $('bkNow').onclick = async () => {
    $('bkNow').disabled = true;
    const { data, error } = await sb.rpc('make_backup');
    $('bkNow').disabled = false;
    if (error) return toast('Lỗi sao lưu: ' + error.message, 6000);
    toast(`Đã sao lưu ${Object.values(data.row_counts).reduce((a, b) => a + b, 0)} dòng (${data.size_kb} KB)`);
    render();
  };
  $('bkDown').onclick = async () => {
    toast('Đang chuẩn bị file...', 8000);
    const { data, error } = await sb.from('backups').select('*').order('taken_at', { ascending: false }).limit(1).single();
    if (error) return toast('Lỗi: ' + error.message, 6000);
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `hdrc-backup-${new Date(data.taken_at).toISOString().slice(0, 10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    toast('Đã tải file sao lưu — cất vào Drive giúp bạn nhé');
  };
}

const I18N_NORM = {};
for (const k in I18N_EN) I18N_NORM[k.replace(/\s+/g, ' ').trim()] = I18N_EN[k];
const I18N_KEYS = Object.keys(I18N_EN).filter(k => k.length >= 5).sort((a, b) => b.length - a.length);
const VI_CHARS = /[ăâêôơưđàáảãạằắẳẵặầấẩẫậèéẻẽẹềếểễệìíỉĩịòóỏõọồốổỗộờớởỡợùúủũụừứửữựỳýỷỹỵĂÂÊÔƠƯĐÀÁẢÃẠẰẮẲẴẶẦẤẨẪẬÈÉẺẼẸỀẾỂỄỆÌÍỈĨỊÒÓỎÕỌỒỐỔỖỘỜỚỞỠỢÙÚỦŨỤỪỨỬỮỰỲÝỶỸỴ]/;
let LANG = 'vi';
try { LANG = localStorage.getItem('hdrc_lang') === 'en' ? 'en' : 'vi'; } catch (e) { }

function trText(s) {
  const t = s.trim();
  if (!t) return s;
  const exact = I18N_EN[t] !== undefined ? I18N_EN[t] : I18N_NORM[t.replace(/\s+/g, ' ')];
  if (exact !== undefined) return s.replace(t, exact);
  if (!VI_CHARS.test(s)) return s;
  let out = s, hit = false;
  for (const k of I18N_KEYS) if (out.indexOf(k) !== -1) { out = out.split(k).join(I18N_EN[k]); hit = true; }
  return hit ? out : s;
}

function applyLang(root) {
  if (LANG !== 'en') return;
  root = root || document.body;
  if (root.nodeType === 3) { const v = trText(root.nodeValue); if (v !== root.nodeValue) root.nodeValue = v; return; }
  if (root.nodeType !== 1) return;
  const skip = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, INPUT: 1 };
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => (skip[n.parentNode && n.parentNode.nodeName] || !/\S/.test(n.nodeValue))
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const todo = [];
  while (w.nextNode()) todo.push(w.currentNode);
  for (const n of todo) { const v = trText(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }
  const all = root.querySelectorAll ? root.querySelectorAll('[placeholder],[title]') : [];
  for (const el of all) {
    if (el.placeholder) { const v = trText(el.placeholder); if (v !== el.placeholder) el.placeholder = v; }
    if (el.title) { const v = trText(el.title); if (v !== el.title) el.title = v; }
  }
}

let i18nBusy = false;
new MutationObserver(ms => {
  if (LANG !== 'en' || i18nBusy) return;
  i18nBusy = true;
  try { for (const m of ms) for (const n of m.addedNodes) applyLang(n); } finally { i18nBusy = false; }
}).observe(document.documentElement, { childList: true, subtree: true });

function setLang(l) {
  LANG = l === 'en' ? 'en' : 'vi';
  try { localStorage.setItem('hdrc_lang', LANG); } catch (e) { }
  document.documentElement.lang = LANG === 'en' ? 'en' : 'vi';
  const b = $('btnLang'); if (b) b.textContent = LANG === 'en' ? 'VI' : 'EN';
  if (LANG === 'en') applyLang(document.body); else location.reload();
}
