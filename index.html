<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATS</title>
<style>
:root{
  --bg:#f3f5f7; --panel:#fff; --line:#e3e8ee; --text:#17212b; --muted:#6b7a8c;
  --t1:#d9efe8; --t7:#0f5547; --accent:#0f7a63; --accent-d:#0b5e4c;
  --danger:#b4443a; --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{background:#f7f9fa}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d)}
.btn.ghost{border:none;background:transparent;color:var(--muted);padding:6px 8px}
.btn.danger{color:var(--danger);border-color:#e7cdca}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* header */
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.5px;font-size:18px}
header select,header input[type=search]{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
header input[type=search]{width:280px}
.spacer{flex:1}
.who{font-size:12px;color:var(--muted)}
label.check{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}

/* summary */
.summary{display:flex;gap:6px;padding:14px 20px 0}
.sum{flex:1;border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}
.sum b{font-size:16px}

/* board */
.board{display:flex;gap:14px;padding:14px 20px 40px;overflow-x:auto;align-items:flex-start;min-height:60vh}
.col{flex:0 0 272px;background:#e8ecf1;border-radius:var(--radius);padding:10px;min-height:120px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px;background:#dfeae6}
.col h3{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between;color:#44566b}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card:hover{border-color:#cfd8e3}
.card.dragging{opacity:.45}
.card .nm{font-weight:700;margin-bottom:2px;word-break:break-word}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:#eef1f5;border-radius:999px;padding:2px 9px;font-size:11px;color:#44566b;white-space:nowrap}
.tag.warn{background:#fdecea;color:#9e3b32}
.empty{color:var(--muted);font-size:13px;padding:4px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.42);display:none;z-index:40}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:430px;max-width:94vw;background:#fff;z-index:50;transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(16,24,40,.12)}
.drawer.on{transform:none}
.drawer header{border-bottom:1px solid var(--line)}
.drawer .body{padding:16px 20px;overflow:auto;flex:1}
.modal{position:fixed;z-index:50;top:50%;left:50%;transform:translate(-50%,-50%);width:560px;max-width:94vw;max-height:88vh;overflow:auto;background:#fff;border-radius:12px;padding:20px;display:none;box-shadow:0 20px 50px rgba(16,24,40,.2)}
.modal.on{display:block}
.modal h2{margin:0 0 14px;font-size:17px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.ev{border-left:2px solid var(--line);padding:0 0 12px 12px;margin-left:4px}
.ev .when{font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 16px;border-radius:8px;z-index:90;display:none}
.toast.on{display:block}
#login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px}
#login h1{margin:0 0 4px;font-size:20px}
#login p{color:var(--muted);margin:0 0 18px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="login" class="hide">
  <h1>ATS</h1>
  <p>Đăng nhập bằng email công ty. Hệ thống gửi link đăng nhập 1 lần.</p>
  <form id="loginForm">
    <div class="field"><label>Email</label><input type="email" id="loginEmail" required placeholder="ban@helidirect.com"></div>
    <button class="btn primary" style="width:100%">Gửi link đăng nhập</button>
  </form>
  <p id="loginMsg" style="margin-top:12px"></p>
</div>

<div id="app" class="hide">
  <header>
    <span class="logo">ATS</span>
    <select id="jobFilter"></select>
    <input type="search" id="search" placeholder="Tìm tên, email, skill, công ty...">
    <label class="check"><input type="checkbox" id="showClosed"> Hiện ứng viên đã loại / rút</label>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="btn" id="btnJobs">Vị trí</button>
    <button class="btn" id="btnRefresh">Làm mới</button>
    <button class="btn" id="btnUpload">Tải CV lên</button>
    <button class="btn primary" id="btnAdd">+ Ứng viên</button>
    <button class="btn ghost" id="btnOut">Thoát</button>
  </header>
  <div class="summary" id="summary"></div>
  <div class="board" id="board"></div>
</div>

<div class="scrim" id="scrim"></div>

<div class="drawer" id="drawer">
  <header>
    <strong id="dName" style="flex:1"></strong>
    <button class="btn ghost" id="dClose">✕</button>
  </header>
  <div class="body" id="dBody"></div>
</div>

<div class="modal" id="modal">
  <h2 id="mTitle"></h2>
  <div id="mBody"></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="cvFile" accept=".pdf,.docx,.txt" class="hide">
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.3';

const SUPABASE_URL = 'https://hzsybxvvcexayducvfll.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jcQmXzefhryIcE7GLn-_8g_WcQCbBSK';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state = { stages: [], jobs: [], candidates: [], job: '', q: '', showClosed: false, drag: null };

function toast(msg, ms = 2600) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}
function daysAgo(ts) {
  const d = Math.floor((Date.now() - new Date(ts)) / 86400000);
  return d <= 0 ? 'hôm nay' : d === 1 ? '1 ngày' : d + ' ngày';
}
function shade(i, n) {
  const p = n > 1 ? i / (n - 1) : 0;
  const mix = (a, b) => Math.round(a + (b - a) * p);
  const bg = `rgb(${mix(217,15)},${mix(239,85)},${mix(232,71)})`;
  return { bg, fg: p > 0.45 ? '#fff' : '#0f5547' };
}

/* ---------- auth ---------- */
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('loginEmail').value.trim();
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href.split('#')[0] } });
  $('loginMsg').textContent = error ? 'Lỗi: ' + error.message : 'Đã gửi link tới ' + email + '. Mở mail và bấm vào link.';
});
$('btnOut').onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ---------- data ---------- */
async function loadAll() {
  const [st, jb, cd] = await Promise.all([
    sb.from('stages').select('*').order('sort_order'),
    sb.from('jobs').select('*').order('title'),
    sb.from('candidates').select('*').order('stage_changed_at', { ascending: false })
  ]);
  for (const r of [st, jb, cd]) if (r.error) { toast('Lỗi tải dữ liệu: ' + r.error.message, 5000); return false; }
  state.stages = st.data; state.jobs = jb.data; state.candidates = cd.data;
  return true;
}

function visible() {
  const q = state.q.toLowerCase().trim();
  return state.candidates.filter(c => {
    if (!state.showClosed && c.status !== 'active') return false;
    if (state.job && c.job_id !== state.job) return false;
    if (!q) return true;
    const hay = [c.full_name, c.email, c.phone, c.current_title, c.current_company, (c.skills || []).join(' ')].join(' ').toLowerCase();
    return hay.includes(q);
  });
}

/* ---------- render ---------- */
function renderJobs() {
  const sel = $('jobFilter');
  sel.innerHTML = '<option value="">Tất cả vị trí</option>' +
    state.jobs.map(j => `<option value="${j.id}" ${state.job === j.id ? 'selected' : ''}>${esc(j.title)}${j.is_open ? '' : ' (đóng)'}</option>`).join('');
}

function render() {
  renderJobs();
  const rows = visible();
  const byStage = Object.fromEntries(state.stages.map(s => [s.key, []]));
  for (const c of rows) (byStage[c.stage] ||= []).push(c);

  $('summary').innerHTML = state.stages.map((s, i) => {
    const { bg, fg } = shade(i, state.stages.length);
    return `<div class="sum" style="background:${bg};color:${fg}"><b>${byStage[s.key].length}</b><span>${esc(s.label)}</span></div>`;
  }).join('');

  $('board').innerHTML = state.stages.map(s => `
    <div class="col" data-stage="${s.key}">
      <h3><span>${esc(s.label)}</span><span>${byStage[s.key].length}</span></h3>
      ${byStage[s.key].map(cardHTML).join('') || '<div class="empty">Chưa có ứng viên</div>'}
    </div>`).join('');

  document.querySelectorAll('.card').forEach(el => {
    el.addEventListener('dragstart', () => { state.drag = el.dataset.id; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => { state.drag = null; el.classList.remove('dragging'); });
    el.addEventListener('click', () => openCandidate(el.dataset.id));
  });
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', async e => {
      e.preventDefault(); col.classList.remove('over');
      const id = state.drag; const stage = col.dataset.stage;
      if (!id) return;
      const c = state.candidates.find(x => x.id === id);
      if (!c || c.stage === stage) return;
      const prev = c.stage; c.stage = stage; c.stage_changed_at = new Date().toISOString(); render();
      const { error } = await sb.from('candidates').update({ stage }).eq('id', id);
      if (error) { c.stage = prev; render(); toast('Không đổi được vòng: ' + error.message, 5000); }
      else toast(c.full_name + ' → ' + state.stages.find(s => s.key === stage).label);
    });
  });
}

function cardHTML(c) {
  const job = state.jobs.find(j => j.id === c.job_id);
  const sub = [c.current_title, c.current_company].filter(Boolean).join(' · ') || 'Chưa rõ vị trí hiện tại';
  const tags = [];
  if (job) tags.push(`<span class="tag">${esc(job.title)}</span>`);
  if (c.years_experience != null) tags.push(`<span class="tag">${c.years_experience} năm</span>`);
  tags.push(`<span class="tag">${daysAgo(c.stage_changed_at)}</span>`);
  if (c.status !== 'active') tags.push(`<span class="tag warn">${c.status === 'rejected' ? 'đã loại' : 'đã rút'}</span>`);
  return `<div class="card" draggable="true" data-id="${c.id}">
    <div class="nm">${esc(c.full_name)}</div>
    <div class="sub">${esc(sub)}</div>
    <div class="tags">${tags.join('')}</div>
  </div>`;
}

/* ---------- drawer ---------- */
function closeAll() {
  $('drawer').classList.remove('on'); $('modal').classList.remove('on'); $('scrim').classList.remove('on');
}
$('scrim').onclick = closeAll; $('dClose').onclick = closeAll;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

async function openCandidate(id) {
  const c = state.candidates.find(x => x.id === id); if (!c) return;
  $('dName').textContent = c.full_name;
  $('drawer').classList.add('on'); $('scrim').classList.add('on');
  $('dBody').innerHTML = '<p class="empty">Đang tải...</p>';
  const { data: events } = await sb.from('candidate_events').select('*').eq('candidate_id', id).order('created_at', { ascending: false });
  $('dBody').innerHTML = `
    ${formHTML(c, 'd')}
    <div class="actions">
      <button class="btn danger" id="dReject">${c.status === 'active' ? 'Loại ứng viên' : 'Mở lại'}</button>
      <button class="btn primary" id="dSave">Lưu</button>
    </div>
    <hr style="border:none;border-top:1px solid var(--line);margin:18px 0">
    <div class="field"><label>Thêm ghi chú</label><textarea id="dNote" rows="3" placeholder="Nhận xét phỏng vấn, mức lương mong muốn..."></textarea></div>
    <div class="actions"><button class="btn" id="dAddNote">Lưu ghi chú</button></div>
    <h4 style="margin:18px 0 10px">Lịch sử</h4>
    ${(events || []).map(evHTML).join('') || '<div class="empty">Chưa có hoạt động</div>'}
    ${c.cv_path ? `<div style="margin-top:14px"><button class="btn" id="dCv">Mở CV (${esc(c.cv_filename || 'file')})</button></div>` : ''}`;

  $('dSave').onclick = async () => {
    const patch = readForm('d');
    const { error } = await sb.from('candidates').update(patch).eq('id', id);
    if (error) return toast('Lỗi lưu: ' + error.message, 5000);
    await loadAll(); render(); openCandidate(id); toast('Đã lưu');
  };
  $('dReject').onclick = async () => {
    const status = c.status === 'active' ? 'rejected' : 'active';
    const { error } = await sb.from('candidates').update({ status }).eq('id', id);
    if (error) return toast('Lỗi: ' + error.message, 5000);
    await loadAll(); render(); openCandidate(id);
  };
  $('dAddNote').onclick = async () => {
    const body = $('dNote').value.trim(); if (!body) return;
    const { error } = await sb.from('candidate_events').insert({ candidate_id: id, type: 'note', body });
    if (error) return toast('Lỗi: ' + error.message, 5000);
    openCandidate(id); toast('Đã thêm ghi chú');
  };
  const cv = $('dCv');
  if (cv) cv.onclick = async () => {
    const { data, error } = await sb.storage.from('cvs').createSignedUrl(c.cv_path, 300);
    if (error) return toast('Lỗi: ' + error.message, 5000);
    window.open(data.signedUrl, '_blank');
  };
}

function evHTML(e) {
  const label = e.type === 'note' ? 'Ghi chú' :
    e.type === 'created' ? 'Tạo hồ sơ' :
    e.type === 'status_change' ? 'Đổi trạng thái: ' + e.body :
    'Chuyển vòng: ' + (e.from_stage || '-') + ' → ' + e.to_stage;
  return `<div class="ev"><div class="when">${new Date(e.created_at).toLocaleString('vi-VN')}</div>
    <div>${esc(label)}</div>${e.type === 'note' ? `<div style="white-space:pre-wrap">${esc(e.body)}</div>` : ''}</div>`;
}

function formHTML(c, p) {
  const jobOpts = ['<option value="">— chưa gán —</option>']
    .concat(state.jobs.map(j => `<option value="${j.id}" ${c.job_id === j.id ? 'selected' : ''}>${esc(j.title)}</option>`)).join('');
  const stageOpts = state.stages.map(s => `<option value="${s.key}" ${c.stage === s.key ? 'selected' : ''}>${esc(s.label)}</option>`).join('');
  return `
  <div class="field"><label>Họ tên *</label><input id="${p}_full_name" value="${esc(c.full_name)}"></div>
  <div class="row2">
    <div class="field"><label>Email</label><input id="${p}_email" value="${esc(c.email)}"></div>
    <div class="field"><label>Điện thoại</label><input id="${p}_phone" value="${esc(c.phone)}"></div>
  </div>
  <div class="row2">
    <div class="field"><label>Chức danh hiện tại</label><input id="${p}_current_title" value="${esc(c.current_title)}"></div>
    <div class="field"><label>Công ty hiện tại</label><input id="${p}_current_company" value="${esc(c.current_company)}"></div>
  </div>
  <div class="row2">
    <div class="field"><label>Số năm kinh nghiệm</label><input id="${p}_years_experience" type="number" step="0.1" value="${c.years_experience ?? ''}"></div>
    <div class="field"><label>Nguồn</label><input id="${p}_source" value="${esc(c.source)}"></div>
  </div>
  <div class="field"><label>Vị trí ứng tuyển</label><select id="${p}_job_id">${jobOpts}</select></div>
  <div class="field"><label>Vòng</label><select id="${p}_stage">${stageOpts}</select></div>
  <div class="field"><label>Kỹ năng (cách nhau bằng dấu phẩy)</label><input id="${p}_skills" value="${esc((c.skills || []).join(', '))}"></div>`;
}

function readForm(p) {
  const v = (k) => $(`${p}_${k}`).value.trim();
  const y = v('years_experience');
  return {
    full_name: v('full_name'), email: v('email') || null, phone: v('phone') || null,
    current_title: v('current_title') || null, current_company: v('current_company') || null,
    years_experience: y === '' ? null : Number(y), source: v('source') || null,
    job_id: v('job_id') || null, stage: v('stage'),
    skills: v('skills') ? v('skills').split(',').map(s => s.trim()).filter(Boolean) : []
  };
}

/* ---------- add candidate ---------- */
function openModal(title, html) {
  $('mTitle').textContent = title; $('mBody').innerHTML = html;
  $('modal').classList.add('on'); $('scrim').classList.add('on');
}

function openAdd(prefill = {}, pending = null) {
  const c = Object.assign({ full_name: '', email: '', phone: '', current_title: '', current_company: '', years_experience: null, source: '', job_id: state.job || '', stage: 'new', skills: [] }, prefill);
  openModal('Thêm ứng viên', formHTML(c, 'a') + `<div class="actions"><button class="btn" id="aCancel">Huỷ</button><button class="btn primary" id="aSave">Lưu</button></div>`);
  $('aCancel').onclick = closeAll;
  $('aSave').onclick = async () => {
    const payload = readForm('a');
    if (!payload.full_name) return toast('Cần nhập họ tên');
    if (pending) payload.cv_text = pending.text?.slice(0, 20000) || null;
    const { data, error } = await sb.from('candidates').insert(payload).select().single();
    if (error) return toast('Lỗi lưu: ' + error.message, 5000);
    if (pending?.file) {
      const path = `${data.id}/${pending.file.name}`;
      const up = await sb.storage.from('cvs').upload(path, pending.file, { upsert: true });
      if (up.error) toast('Lưu hồ sơ OK nhưng upload CV lỗi: ' + up.error.message, 5000);
      else await sb.from('candidates').update({ cv_path: path, cv_filename: pending.file.name }).eq('id', data.id);
    }
    closeAll(); await loadAll(); render(); toast('Đã thêm ' + payload.full_name);
  };
}
$('btnAdd').onclick = () => openAdd();

/* ---------- jobs ---------- */
$('btnJobs').onclick = () => {
  openModal('Vị trí tuyển dụng', `
    <div id="jobList">${state.jobs.map(j => `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
      <span style="flex:1">${esc(j.title)}${j.department ? ' · ' + esc(j.department) : ''}</span>
      <button class="btn ghost" data-toggle="${j.id}">${j.is_open ? 'Đang mở' : 'Đã đóng'}</button></div>`).join('') || '<div class="empty">Chưa có vị trí nào</div>'}</div>
    <hr style="border:none;border-top:1px solid var(--line);margin:14px 0">
    <div class="row2"><div class="field"><label>Tên vị trí</label><input id="jTitle"></div>
    <div class="field"><label>Bộ phận</label><input id="jDept"></div></div>
    <div class="actions"><button class="btn" id="jCancel">Đóng</button><button class="btn primary" id="jAdd">Thêm vị trí</button></div>`);
  $('jCancel').onclick = closeAll;
  $('jAdd').onclick = async () => {
    const title = $('jTitle').value.trim(); if (!title) return toast('Nhập tên vị trí');
    const { error } = await sb.from('jobs').insert({ title, department: $('jDept').value.trim() || null });
    if (error) return toast('Lỗi: ' + error.message, 5000);
    await loadAll(); render(); closeAll(); toast('Đã thêm vị trí ' + title);
  };
  document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
    const j = state.jobs.find(x => x.id === b.dataset.toggle);
    await sb.from('jobs').update({ is_open: !j.is_open }).eq('id', j.id);
    await loadAll(); render(); closeAll();
  });
};

/* ---------- CV upload + parse ---------- */
$('btnUpload').onclick = () => $('cvFile').click();
$('cvFile').onchange = async (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  toast('Đang đọc ' + file.name + '...', 8000);
  let text = '';
  try { text = await extractText(file); } catch (err) { console.error(err); }
  if (!text.trim()) { toast('Không đọc được nội dung CV, nhập tay giúp tớ', 5000); return openAdd({}, { file }); }
  let fields = {};
  try {
    const { data, error } = await sb.functions.invoke('parse-cv', { body: { text, filename: file.name } });
    if (error) throw error;
    fields = data?.candidate || {};
    toast('Đã rút thông tin bằng ' + (data?.engine === 'ai' ? 'AI' : 'quy tắc') + ', kiểm tra lại giúp tớ', 4000);
  } catch (err) {
    toast('Parse lỗi (' + err.message + '), điền tay giúp tớ', 5000);
  }
  openAdd(fields, { file, text });
};

async function extractText(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.txt')) return await file.text();
  if (name.endsWith('.docx')) {
    const mammoth = await import('https://esm.sh/mammoth@1.13.0');
    const r = await (mammoth.default || mammoth).extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return r.value;
  }
  if (name.endsWith('.pdf')) {
    const pdfjs = await import('https://esm.sh/pdfjs-dist@6.4.299/build/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = 'https://esm.sh/pdfjs-dist@6.4.299/build/pdf.worker.min.mjs';
    const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
    let out = '';
    for (let p = 1; p <= Math.min(doc.numPages, 8); p++) {
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      out += tc.items.map(i => i.str).join(' ') + '\n';
    }
    return out;
  }
  return '';
}

/* ---------- wiring ---------- */
$('jobFilter').onchange = e => { state.job = e.target.value; render(); };
$('search').oninput = e => { state.q = e.target.value; render(); };
$('showClosed').onchange = e => { state.showClosed = e.target.checked; render(); };
$('btnRefresh').onclick = async () => { await loadAll(); render(); toast('Đã làm mới'); };

sb.auth.onAuthStateChange(async (_e, session) => { await boot(session); });

async function boot(session) {
  session = session || (await sb.auth.getSession()).data.session;
  if (!session) { $('login').classList.remove('hide'); $('app').classList.add('hide'); return; }
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('who').textContent = session.user.email;
  if (await loadAll()) render();
}
boot();
</script>
