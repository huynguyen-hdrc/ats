<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HDRC - Human Resource Management</title>
<style>
:root{
  --bg:#f3f5f7; --panel:#fff; --line:#e3e8ee; --text:#17212b; --muted:#6b7a8c;
  --accent:#0f7a63; --accent-d:#0b5e4c; --danger:#b4443a; --warn:#b5761f; --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{background:#f7f9fa}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d)}
.btn.ghost{border:none;background:transparent;color:var(--muted);padding:6px 8px}
.btn.danger{color:var(--danger);border-color:#e7cdca}
.btn.sm{padding:5px 10px;font-size:13px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hide{display:none!important}

header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.5px;font-size:18px}
.brandsub{color:var(--muted);font-size:12px;font-weight:600}
.spacer{flex:1}
.who{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:none;background:none;padding:11px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;padding:14px 20px 0;flex-wrap:wrap}
.toolbar input[type=search],.toolbar select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.toolbar input[type=search]{width:260px}
label.check{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
main{padding:14px 20px 48px}
h2.sec{margin:0 0 12px;font-size:16px}

.summary{display:flex;gap:6px;margin-bottom:14px}
.sum{flex:1;border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}
.sum b{font-size:16px}
.board{display:flex;gap:14px;overflow-x:auto;align-items:flex-start;min-height:50vh}
.col{flex:0 0 272px;background:#e8ecf1;border-radius:var(--radius);padding:10px;min-height:120px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px;background:#dfeae6}
.col h3{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between;color:#44566b}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:grab}
.card:hover{border-color:#cfd8e3}
.card.dragging{opacity:.45}
.card .nm{font-weight:700;margin-bottom:2px;word-break:break-word}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:#eef1f5;border-radius:999px;padding:2px 9px;font-size:11px;color:#44566b;white-space:nowrap}
.tag.warn{background:#fdecea;color:#9e3b32}
.tag.ok{background:#e4f3ec;color:#17694f}
.tag.soon{background:#fdf3e2;color:#8a5a12}
.empty{color:var(--muted);font-size:13px;padding:10px 4px}

table.grid{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table.grid th,table.grid td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.grid th{background:#f7f9fa;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
table.grid tr:last-child td{border-bottom:none}
table.grid tbody tr:hover{background:#f9fbfc;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.panel h4{margin:0 0 6px;font-size:15px}
.meta{color:var(--muted);font-size:12px}
.bar{height:6px;background:#e8ecf1;border-radius:999px;overflow:hidden;margin:8px 0}
.bar > i{display:block;height:100%;background:var(--accent)}

.org{display:flex;gap:10px;flex-direction:column}
.org ul{list-style:none;margin:0;padding-left:22px;border-left:1px solid var(--line)}
.org > ul{padding-left:0;border-left:none}
.org li{margin:6px 0}
.node{display:inline-flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:200px}
.node b{font-size:13px}
.node span{color:var(--muted);font-size:12px}

.scrim{position:fixed;inset:0;background:rgba(16,24,40,.42);display:none;z-index:40}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:460px;max-width:96vw;background:#fff;z-index:50;transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(16,24,40,.12)}
.drawer.on{transform:none}
.drawer header{border-bottom:1px solid var(--line)}
.drawer .body{padding:16px 20px;overflow:auto;flex:1}
.modal{position:fixed;z-index:50;top:50%;left:50%;transform:translate(-50%,-50%);width:640px;max-width:95vw;max-height:88vh;overflow:auto;background:#fff;border-radius:12px;padding:20px;display:none;box-shadow:0 20px 50px rgba(16,24,40,.2)}
.modal.on{display:block}
.modal h2{margin:0 0 14px;font-size:17px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.ev{border-left:2px solid var(--line);padding:0 0 12px 12px;margin-left:4px}
.ev .when{font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 16px;border-radius:8px;z-index:90;display:none;max-width:90vw}
.toast.on{display:block}
#login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px}
#login h1{margin:0 0 2px;font-size:20px}
#login p{color:var(--muted);margin:0 0 18px}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.checklist li.done span.t{text-decoration:line-through;color:var(--muted)}
.checklist input{margin-top:3px}
</style>
</head>
<body>
<div id="login" class="hide">
  <h1>HDRC</h1>
  <div class="brandsub" style="margin-bottom:10px">Human Resource Management</div>
  <p>Đăng nhập bằng email công ty. Hệ thống gửi link đăng nhập 1 lần.</p>
  <form id="loginForm">
    <div class="field"><label>Email</label><input type="email" id="loginEmail" required placeholder="ban@helidirect.com"></div>
    <button class="btn primary" style="width:100%">Gửi link đăng nhập</button>
  </form>
  <p id="loginMsg" style="margin-top:12px"></p>
</div>

<div id="app" class="hide">
  <header>
    <span class="logo">HDRC</span><span class="brandsub">Human Resource Management</span>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <a class="btn" href="./selftest.html" title="Chạy kiểm tra toàn bộ chức năng">Kiểm tra hệ thống</a>
    <button class="btn" id="btnRefresh">Làm mới</button>
    <button class="btn ghost" id="btnOut">Thoát</button>
  </header>
  <nav id="nav"></nav>
  <div class="toolbar" id="toolbar"></div>
  <main id="view"></main>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <header style="display:flex;align-items:center;padding:12px 16px">
    <strong id="dName" style="flex:1"></strong>
    <button class="btn ghost" id="dClose">✕</button>
  </header>
  <div class="body" id="dBody"></div>
</div>
<div class="modal" id="modal"><h2 id="mTitle"></h2><div id="mBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="cvFile" accept=".pdf,.docx,.txt" class="hide">
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.3';
const sb = createClient('https://hzsybxvvcexayducvfll.supabase.co', 'sb_publishable_jcQmXzefhryIcE7GLn-_8g_WcQCbBSK');

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = (s) => esc(s).replace(/\n/g, '<br>');
const d = (s) => s ? new Date(s).toLocaleDateString('vi-VN') : '';
const money = (n) => n == null ? '' : Number(n).toLocaleString('vi-VN');
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (iso, n) => { const x = new Date(iso); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
const dayDiff = (iso) => Math.ceil((new Date(iso) - new Date(today())) / 86400000);

function toast(msg, ms = 2800) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}
function daysAgo(ts) {
  const n = Math.floor((Date.now() - new Date(ts)) / 86400000);
  return n <= 0 ? 'hôm nay' : n + ' ngày';
}
const state = { view: 'pipeline', q: '', job: '', showClosed: false, drag: null,
  stages: [], jobs: [], candidates: [], employees: [], contracts: [], obItems: [], obTemplates: [], reviews: [] };

/* ---------- generic form engine ---------- */
function fieldsHTML(spec, v = {}, p = 'f') {
  return spec.map(f => {
    const id = `${p}_${f.k}`, val = v[f.k] ?? '';
    let input;
    if (f.type === 'select') {
      input = `<select id="${id}">` + f.opts.map(o =>
        `<option value="${esc(o[0])}" ${String(val) === String(o[0]) ? 'selected' : ''}>${esc(o[1])}</option>`).join('') + '</select>';
    } else if (f.type === 'textarea') {
      input = `<textarea id="${id}" rows="${f.rows || 4}" placeholder="${esc(f.hint || '')}">${esc(val)}</textarea>`;
    } else {
      input = `<input id="${id}" type="${f.type || 'text'}" ${f.step ? `step="${f.step}"` : ''} value="${esc(val)}" placeholder="${esc(f.hint || '')}">`;
    }
    return `<div class="field"${f.wide ? ' style="grid-column:1/-1"' : ''}><label>${esc(f.label)}</label>${input}</div>`;
  }).join('');
}
function readFields(spec, p = 'f') {
  const o = {};
  for (const f of spec) {
    let v = $(`${p}_${f.k}`).value.trim();
    if (f.type === 'number') o[f.k] = v === '' ? null : Number(v);
    else o[f.k] = v === '' ? null : v;
  }
  return o;
}
function formModal(title, spec, values, onSave) {
  openModal(title, `<div class="row2">${fieldsHTML(spec, values)}</div>
    <div class="actions"><button class="btn" id="fCancel">Huỷ</button><button class="btn primary" id="fSave">Lưu</button></div>`);
  $('fCancel').onclick = closeAll;
  $('fSave').onclick = async () => { await onSave(readFields(spec)); };
}
async function upsert(table, payload, id) {
  const r = id ? await sb.from(table).update(payload).eq('id', id) : await sb.from(table).insert(payload);
  if (r.error) { toast('Lỗi lưu: ' + r.error.message, 6000); return false; }
  await loadAll(); render(); return true;
}
async function removeRow(table, id, label) {
  if (!confirm('Xoá ' + label + '? Không khôi phục được.')) return;
  const r = await sb.from(table).delete().eq('id', id);
  if (r.error) return toast('Lỗi xoá: ' + r.error.message, 6000);
  closeAll(); await loadAll(); render(); toast('Đã xoá');
}

/* ---------- overlays ---------- */
function closeAll() { $('drawer').classList.remove('on'); $('modal').classList.remove('on'); $('scrim').classList.remove('on'); }
function openModal(title, html) { $('mTitle').textContent = title; $('mBody').innerHTML = html; $('modal').classList.add('on'); $('scrim').classList.add('on'); }
function openDrawer(title, html) { $('dName').textContent = title; $('dBody').innerHTML = html; $('drawer').classList.add('on'); $('scrim').classList.add('on'); }
$('scrim').onclick = closeAll; $('dClose').onclick = closeAll;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

/* ---------- auth ---------- */
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('loginEmail').value.trim();
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href.split('#')[0] } });
  $('loginMsg').textContent = error ? 'Lỗi: ' + error.message : 'Đã gửi link tới ' + email + '. Mở mail và bấm vào link.';
});
$('btnOut').onclick = async () => { await sb.auth.signOut(); location.reload(); };
$('btnRefresh').onclick = async () => { await loadAll(); render(); toast('Đã làm mới'); };

/* ---------- data ---------- */
async function loadAll() {
  const r = await Promise.all([
    sb.from('stages').select('*').order('sort_order'),
    sb.from('jobs').select('*').order('title'),
    sb.from('candidates').select('*').order('stage_changed_at', { ascending: false }),
    sb.from('employees').select('*').order('full_name'),
    sb.from('contracts').select('*').order('end_date', { nullsFirst: false }),
    sb.from('onboarding_items').select('*').order('sort_order'),
    sb.from('onboarding_templates').select('*, onboarding_template_items(*)').order('name'),
    sb.from('probation_reviews').select('*').order('review_date', { ascending: false })
  ]);
  const bad = r.find(x => x.error);
  if (bad) { toast('Lỗi tải dữ liệu: ' + bad.error.message, 6000); return false; }
  [state.stages, state.jobs, state.candidates, state.employees, state.contracts, state.obItems, state.obTemplates, state.reviews] = r.map(x => x.data);
  return true;
}
const empName = (id) => state.employees.find(e => e.id === id)?.full_name || '';
const jobName = (id) => state.jobs.find(j => j.id === id)?.title || '';

/* ---------- router ---------- */
const VIEWS = [
  ['pipeline', 'Tuyển dụng'],
  ['jobs', 'Vị trí & JD'],
  ['people', 'Danh bạ nhân sự'],
  ['org', 'Sơ đồ tổ chức'],
  ['onboarding', 'Onboarding'],
  ['contracts', 'Hợp đồng'],
  ['probation', 'Thử việc']
];
function render() {
  $('nav').innerHTML = VIEWS.map(([k, l]) => `<button data-v="${k}" class="${state.view === k ? 'on' : ''}">${l}</button>`).join('');
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { state.view = b.dataset.v; state.q = ''; render(); });
  ({ pipeline: viewPipeline, jobs: viewJobs, people: viewPeople, org: viewOrg,
     onboarding: viewOnboarding, contracts: viewContracts, probation: viewProbation })[state.view]();
  wireXlsx();
}
function searchBox(ph) {
  return `<input type="search" id="tq" placeholder="${esc(ph)}" value="${esc(state.q)}">`;
}
function wireSearch() {
  const i = $('tq'); if (!i) return;
  i.oninput = e => { state.q = e.target.value; render(); i.focus(); };
}
const hit = (obj, keys) => {
  const q = state.q.toLowerCase().trim();
  if (!q) return true;
  return keys.map(k => obj[k]).join(' ').toLowerCase().includes(q);
};

/* =================== 1. PIPELINE (kanban) =================== */
function shade(i, n) {
  const p = n > 1 ? i / (n - 1) : 0, mix = (a, b) => Math.round(a + (b - a) * p);
  return { bg: `rgb(${mix(217,15)},${mix(239,85)},${mix(232,71)})`, fg: p > 0.45 ? '#fff' : '#0f5547' };
}
const CAND_SPEC = () => [
  { k: 'full_name', label: 'Họ tên *' },
  { k: 'email', label: 'Email' },
  { k: 'phone', label: 'Điện thoại' },
  { k: 'current_title', label: 'Chức danh hiện tại' },
  { k: 'current_company', label: 'Công ty hiện tại' },
  { k: 'years_experience', label: 'Số năm kinh nghiệm', type: 'number', step: '0.1' },
  { k: 'source', label: 'Nguồn' },
  { k: 'job_id', label: 'Vị trí ứng tuyển', type: 'select', opts: [['', '— chưa gán —'], ...state.jobs.map(j => [j.id, j.title])] },
  { k: 'stage', label: 'Vòng', type: 'select', opts: state.stages.map(s => [s.key, s.label]) },
  { k: 'skills_text', label: 'Kỹ năng (cách nhau bằng dấu phẩy)', wide: true }
];
const toCand = (o) => { const { skills_text, ...r } = o; return { ...r, skills: skills_text ? skills_text.split(',').map(s => s.trim()).filter(Boolean) : [] }; };
const fromCand = (c) => ({ ...c, skills_text: (c.skills || []).join(', ') });

function viewPipeline() {
  $('toolbar').innerHTML = `
    <select id="jobFilter"><option value="">Tất cả vị trí</option>${state.jobs.map(j => `<option value="${j.id}" ${state.job === j.id ? 'selected' : ''}>${esc(j.title)}</option>`).join('')}</select>
    ${searchBox('Tìm tên, email, skill, công ty...')}
    <label class="check"><input type="checkbox" id="showClosed" ${state.showClosed ? 'checked' : ''}> Hiện ứng viên đã loại / rút</label>
    <span class="spacer"></span>
    <button class="btn" id="btnUpload">Tải CV lên</button>
    <button class="btn primary" id="btnAddCand">+ Ứng viên</button>
    ${xlsxBar('candidates')}`;
  wireSearch();
  $('jobFilter').onchange = e => { state.job = e.target.value; render(); };
  $('showClosed').onchange = e => { state.showClosed = e.target.checked; render(); };
  $('btnAddCand').onclick = () => openAddCandidate();
  $('btnUpload').onclick = () => $('cvFile').click();

  const rows = state.candidates.filter(c =>
    (state.showClosed || c.status === 'active') &&
    (!state.job || c.job_id === state.job) &&
    hit({ ...c, sk: (c.skills || []).join(' ') }, ['full_name', 'email', 'phone', 'current_title', 'current_company', 'sk']));
  const by = Object.fromEntries(state.stages.map(s => [s.key, []]));
  rows.forEach(c => (by[c.stage] ||= []).push(c));

  $('view').innerHTML = `
    <div class="summary">${state.stages.map((s, i) => { const { bg, fg } = shade(i, state.stages.length);
      return `<div class="sum" style="background:${bg};color:${fg}"><b>${by[s.key].length}</b><span>${esc(s.label)}</span></div>`; }).join('')}</div>
    <div class="board">${state.stages.map(s => `
      <div class="col" data-stage="${s.key}">
        <h3><span>${esc(s.label)}</span><span>${by[s.key].length}</span></h3>
        ${by[s.key].map(candCard).join('') || '<div class="empty">Chưa có ứng viên</div>'}
      </div>`).join('')}</div>`;

  document.querySelectorAll('.card').forEach(el => {
    el.addEventListener('dragstart', () => { state.drag = el.dataset.id; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => { state.drag = null; el.classList.remove('dragging'); });
    el.addEventListener('click', () => openCandidate(el.dataset.id));
  });
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', async e => {
      e.preventDefault(); col.classList.remove('over');
      const id = state.drag, stage = col.dataset.stage; if (!id) return;
      const c = state.candidates.find(x => x.id === id);
      if (!c || c.stage === stage) return;
      const prev = c.stage; c.stage = stage; c.stage_changed_at = new Date().toISOString(); render();
      const { error } = await sb.from('candidates').update({ stage }).eq('id', id);
      if (error) { c.stage = prev; render(); toast('Không đổi được vòng: ' + error.message, 6000); }
      else toast(c.full_name + ' → ' + state.stages.find(s => s.key === stage).label);
    });
  });
}
function candCard(c) {
  const t = [];
  if (c.job_id) t.push(`<span class="tag">${esc(jobName(c.job_id))}</span>`);
  if (c.years_experience != null) t.push(`<span class="tag">${c.years_experience} năm</span>`);
  t.push(`<span class="tag">${daysAgo(c.stage_changed_at)}</span>`);
  if (c.status !== 'active') t.push(`<span class="tag warn">${c.status === 'rejected' ? 'đã loại' : 'đã rút'}</span>`);
  return `<div class="card" draggable="true" data-id="${c.id}">
    <div class="nm">${esc(c.full_name)}</div>
    <div class="sub">${esc([c.current_title, c.current_company].filter(Boolean).join(' · ') || 'Chưa rõ vị trí hiện tại')}</div>
    <div class="tags">${t.join('')}</div></div>`;
}
function openAddCandidate(prefill = {}, pending = null) {
  const v = fromCand({ stage: 'new', job_id: state.job || '', ...prefill });
  formModal('Thêm ứng viên', CAND_SPEC(), v, async (raw) => {
    const payload = toCand(raw);
    if (!payload.full_name) return toast('Cần nhập họ tên');
    if (pending?.text) payload.cv_text = pending.text.slice(0, 20000);

/* CV upload + parse */
$('cvFile').onchange = async (e) => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  toast('Đang đọc ' + file.name + '...', 9000);
  let text = '';
  try { text = await extractText(file); } catch (err) { console.error(err); }
  if (!text.trim()) { toast('Không đọc được nội dung CV, nhập tay giúp bạn nhé', 5000); return openAddCandidate({}, { file }); }
  let fields = {};
  try {
    const { data, error } = await sb.functions.invoke('parse-cv', { body: { text, filename: file.name } });
    if (error) throw error;
    if (data?.not_a_cv) toast('File này giống mô tả công việc hơn là CV — kiểm tra lại giúp bạn nhé', 6000);
    fields = data?.candidate || {};
    toast('Đã rút thông tin bằng ' + (data?.engine === 'ai' ? 'AI' : 'quy tắc') + ', kiểm tra lại trước khi lưu', 5000);
  } catch (err) { toast('Parse lỗi (' + err.message + '), điền tay giúp bạn nhé', 6000); }
  openAddCandidate(fields, { file, text });
};
async function extractText(file) {
  const n = file.name.toLowerCase();
  if (n.endsWith('.txt')) return await file.text();
  if (n.endsWith('.docx')) {
    const mammoth = await import('https://esm.sh/mammoth@1.13.0');
    return (await (mammoth.default || mammoth).extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
  }
  if (n.endsWith('.pdf')) {
    const pdfjs = await import('https://esm.sh/pdfjs-dist@6.4.299/build/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = 'https://esm.sh/pdfjs-dist@6.4.299/build/pdf.worker.min.mjs';
    const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
    let out = '';
    for (let p = 1; p <= Math.min(doc.numPages, 8); p++) {
      const tc = await (await doc.getPage(p)).getTextContent();
      out += tc.items.map(i => i.str).join(' ') + '\n';
    }
    return out;
  }
  return '';
}

function viewOrg() {
  $('toolbar').innerHTML = `<span class="meta">Sơ đồ dựng tự động từ cột "Quản lý trực tiếp" trong Danh bạ nhân sự.</span>${xlsxBar('employees')}`;
  const active = state.employees.filter(e => e.status !== 'left');
  const kids = (pid) => active.filter(e => (e.manager_id || null) === pid);
  const seen = new Set();
  const node = (e) => {
    if (seen.has(e.id)) return `<li><div class="node"><b>${esc(e.full_name)}</b><span>vòng lặp quản lý — kiểm tra lại</span></div></li>`;
    seen.add(e.id);
    const ch = kids(e.id);
    return `<li><div class="node"><b>${esc(e.full_name)}</b><span>${esc([e.title, e.department].filter(Boolean).join(' · '))}</span></div>
      ${ch.length ? `<ul>${ch.map(node).join('')}</ul>` : ''}</li>`;
  };
  const roots = kids(null);
  const orphans = active.filter(e => e.manager_id && !active.some(m => m.id === e.manager_id));
  $('view').innerHTML = (roots.length || orphans.length)
    ? `<div class="org"><ul>${roots.concat(orphans).map(node).join('')}</ul></div>`
    : '<div class="empty">Chưa có nhân sự, hoặc mọi người đều có quản lý (vòng lặp). Thêm nhân sự ở tab Danh bạ.</div>';
}

const normH = (h) => String(h ?? '').toLowerCase().replace(/\(.*?\)/g, '').replace(/[*:]/g, '').replace(/\s+/g, ' ').trim();
function xlDate(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  if (typeof v === 'number') return new Date(Date.UTC(1899, 11, 30) + v * 86400000).toISOString().slice(0, 10);
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  return undefined;
}
function xlNum(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v;
  const n = Number(String(v).replace(/[^\d.,-]/g, '').replace(/\.(?=\d{3}\b)/g, '').replace(/,(?=\d{3}\b)/g, '').replace(',', '.'));
  return Number.isFinite(n) ? n : undefined;
}
const xlBool = (v) => v == null || v === '' ? undefined : /^(có|co|x|yes|true|1|đang tuyển)$/i.test(String(v).trim());
function cellOut(col, row) {
  const v = row[col.k];
  if (col.lookup === 'employee') return empName(v);
  if (col.lookup === 'job') return jobName(v);
  if (col.list) return (v || []).join(', ');
  if (col.bool) return v ? 'Có' : 'Không';
  if (col.stage) return state.stages.find(s => s.key === v)?.label || v || '';
  if (col.map) return Object.keys(col.map).find(k => col.map[k] === v) || '';
  return v ?? '';
}
function cellIn(col, raw, rowErrors) {
  const v = typeof raw === 'string' ? raw.trim() : raw;
  const empty = v == null || v === '';
  if (empty) {
    if (col.req) { rowErrors.push(`thiếu "${col.h}"`); return undefined; }
    return col.def !== undefined ? col.def : null;
  }
  if (col.lookup === 'employee') {
    const e = state.employees.find(x => x.full_name.toLowerCase() === String(v).toLowerCase());
    if (!e) { rowErrors.push(`không tìm thấy nhân sự "${v}"`); return undefined; }
    return e.id;
  }
  if (col.lookup === 'job') {
    const j = state.jobs.find(x => x.title.toLowerCase() === String(v).toLowerCase());
    if (!j) { rowErrors.push(`không tìm thấy vị trí "${v}"`); return undefined; }
    return j.id;
  }
  if (col.stage) {
    const st = state.stages.find(s => s.key === String(v).toLowerCase() || s.label.toLowerCase() === String(v).toLowerCase());
    if (!st) { rowErrors.push(`vòng "${v}" không hợp lệ`); return undefined; }
    return st.key;
  }
  if (col.map) {
    const codes = Object.values(col.map);
    if (codes.includes(String(v))) return String(v);
    const hit = Object.keys(col.map).find(k => k.toLowerCase() === String(v).toLowerCase());
    if (!hit) { rowErrors.push(`"${col.h}" chỉ nhận: ${Object.keys(col.map).join(' / ')}`); return undefined; }
    return col.map[hit];
  }
  if (col.enum) {
    const hit = col.enum.find(x => x.toLowerCase() === String(v).toLowerCase());
    if (!hit) { rowErrors.push(`"${col.h}" chỉ nhận: ${col.enum.join(' / ')}`); return undefined; }
    return hit;
  }
  if (col.bool) { const b = xlBool(v); return b === undefined ? true : b; }
  if (col.date) { const d = xlDate(v); if (d === undefined) { rowErrors.push(`ngày "${v}" sai định dạng, cần yyyy-mm-dd`); return undefined; } return d; }
  if (col.num) { const n = xlNum(v); if (n === undefined) { rowErrors.push(`"${col.h}" phải là số, đang là "${v}"`); return undefined; } return n; }
  if (col.list) return String(v).split(',').map(x => x.trim()).filter(Boolean);
  return String(v);
}
/* đọc mảng 2 chiều từ Excel → danh sách bản ghi + lỗi theo dòng */
function parseAoa(entity, aoa) {
  const cfg = SHEETS[entity], headers = (aoa[0] || []).map(normH);
  const idx = {};
  cfg.cols.forEach(c => { const i = headers.indexOf(normH(c.h)); if (i >= 0) idx[c.k] = i; });
  const missing = cfg.cols.filter(c => c.req && idx[c.k] === undefined).map(c => c.h);
  const rows = [], errors = [];
  if (missing.length) return { rows, errors: [{ line: 1, msgs: ['thiếu cột bắt buộc: ' + missing.join(', ')] }], missing };
  aoa.slice(1).forEach((r, n) => {
    if (!r || r.every(c => c == null || String(c).trim() === '')) return;
    const msgs = [], out = {};
    cfg.cols.forEach(c => {
      if (idx[c.k] === undefined) { if (c.def !== undefined) out[c.k] = c.def; return; }
      const v = cellIn(c, r[idx[c.k]], msgs);
      if (v !== undefined) out[c.k] = v;
    });
    if (msgs.length) errors.push({ line: n + 2, msgs });
    else rows.push(out);
  });
  return { rows, errors, missing };
}
async function exportSheet(entity) {
  const XLSX = await loadXLSX();
  const cfg = SHEETS[entity];
  const data = cfg.rows().map(r => Object.fromEntries(cfg.cols.map(c => [c.h.replace(' *', ''), cellOut(c, r)])));
  if (!data.length) return toast('Chưa có dữ liệu để xuất');
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = cfg.cols.map(c => ({ wch: Math.max(14, Math.min(38, c.h.length + 6)) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, cfg.label.slice(0, 28));
  XLSX.writeFile(wb, `${cfg.file}-${today()}.xlsx`);
  toast(`Đã xuất ${data.length} dòng`);
}
async function templateSheet(entity) {
  const XLSX = await loadXLSX();
  const cfg = SHEETS[entity];
  const ws = XLSX.utils.aoa_to_sheet([cfg.cols.map(c => c.h), cfg.sample || []]);
  ws['!cols'] = cfg.cols.map(c => ({ wch: Math.max(14, Math.min(38, c.h.length + 6)) }));
  const guide = [['Hướng dẫn nhập liệu'], ['Cột có dấu * là bắt buộc.'], ['Ngày ghi dạng yyyy-mm-dd hoặc dd/mm/yyyy.'],
    ['Dòng mẫu ở sheet đầu chỉ để tham khảo — xoá đi trước khi nhập.'], ['Giá trị cho phép:'], []];
  cfg.cols.forEach(c => {
    if (c.map) guide.push([c.h, Object.keys(c.map).join(' / ')]);
    else if (c.enum) guide.push([c.h, c.enum.join(' / ')]);
    else if (c.bool) guide.push([c.h, 'Có / Không']);
    else if (c.stage) guide.push([c.h, state.stages.map(s => s.label).join(' / ')]);
    else if (c.lookup) guide.push([c.h, 'phải trùng tên đã có trong app']);
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Nhap lieu');
  const gs = XLSX.utils.aoa_to_sheet(guide); gs['!cols'] = [{ wch: 34 }, { wch: 60 }];
  XLSX.utils.book_append_sheet(wb, gs, 'Huong dan');
  XLSX.writeFile(wb, `mau-${cfg.file}.xlsx`);
  toast('Đã tải file mẫu');
}
function pickImport(entity) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.xlsx,.xls,.csv';
  inp.onchange = async () => { if (inp.files[0]) await previewImport(entity, inp.files[0]); };
  inp.click();
}
async function previewImport(entity, file) {
  const cfg = SHEETS[entity];
  let parsed;
  try {
    const XLSX = await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true });
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
    parsed = parseAoa(entity, aoa);
  } catch (e) { return toast('Không đọc được file: ' + e.message, 6000); }
  const { rows, errors } = parsed;
  const key = cfg.keyField;
  const existing = key ? (cfg.rows() || []) : [];
  const dup = key ? rows.filter(r => r[key] && existing.some(e => String(e[key] || '').toLowerCase() === String(r[key]).toLowerCase())) : [];
  openModal(`Nhập Excel — ${cfg.label}`, `
    <p><b>${rows.length}</b> dòng hợp lệ · <b style="color:var(--danger)">${errors.length}</b> dòng lỗi${dup.length ? ` · <b>${dup.length}</b> dòng trùng (${key}) sẽ được cập nhật thay vì tạo mới` : ''}</p>
    ${errors.length ? `<div class="panel" style="max-height:200px;overflow:auto;margin-bottom:12px">
      ${errors.slice(0, 50).map(e => `<div class="meta">Dòng ${e.line}: ${esc(e.msgs.join('; '))}</div>`).join('')}
      ${errors.length > 50 ? `<div class="meta">... và ${errors.length - 50} dòng nữa</div>` : ''}</div>` : ''}
    ${rows.length ? `<table class="grid"><thead><tr>${cfg.cols.slice(0, 5).map(c => `<th>${esc(c.h.replace(' *', ''))}</th>`).join('')}</tr></thead>
      <tbody>${rows.slice(0, 5).map(r => `<tr>${cfg.cols.slice(0, 5).map(c => `<td>${esc(String(cellOut(c, r) ?? ''))}</td>`).join('')}</tr>`).join('')}</tbody></table>
      <div class="meta" style="margin-top:6px">Xem trước 5 dòng đầu.</div>` : ''}
    <div class="actions"><button class="btn" id="imCancel">Huỷ</button>
      <button class="btn primary" id="imGo" ${rows.length ? '' : 'disabled'}>Nhập ${rows.length} dòng</button></div>`);
  $('imCancel').onclick = closeAll;
  $('imGo').onclick = async () => {
    $('imGo').disabled = true;
    let ins = 0, upd = 0;
    for (const r of rows) {
      const match = key && r[key] ? existing.find(e => String(e[key] || '').toLowerCase() === String(r[key]).toLowerCase()) : null;
      const res = match ? await sb.from(cfg.table).update(r).eq('id', match.id) : await sb.from(cfg.table).insert(r);
      if (res.error) { toast(`Lỗi ở dòng "${r.full_name || r.title || ''}": ${res.error.message}`, 8000); $('imGo').disabled = false; return; }
      match ? upd++ : ins++;
    }
    closeAll(); await loadAll(); render();
    toast(`Đã nhập: ${ins} dòng mới${upd ? `, cập nhật ${upd} dòng` : ''}`);
  };
}
function xlsxBar(entity) {
  const cfg = SHEETS[entity];
  return `<span class="spacer"></span>
    <button class="btn sm" data-xl-tpl="${entity}" ${cfg.importable ? '' : 'style="display:none"'}>Tải mẫu Excel</button>
    <button class="btn sm" data-xl-imp="${entity}" ${cfg.importable ? '' : 'style="display:none"'}>Nhập Excel</button>
    <button class="btn sm" data-xl-exp="${entity}">Xuất Excel</button>`;
}
function wireXlsx() {
  document.querySelectorAll('[data-xl-tpl]').forEach(b => b.onclick = () => templateSheet(b.dataset.xlTpl).catch(e => toast(e.message, 6000)));
  document.querySelectorAll('[data-xl-imp]').forEach(b => b.onclick = () => pickImport(b.dataset.xlImp));
  document.querySelectorAll('[data-xl-exp]').forEach(b => b.onclick = () => exportSheet(b.dataset.xlExp).catch(e => toast(e.message, 6000)));
}
window.__hdrc = { SHEETS, parseAoa, xlDate, xlNum, cellOut };

/* ---------- boot ---------- */
sb.auth.onAuthStateChange(async (_e, session) => { await boot(session); });
async function boot(session) {
  session = session || (await sb.auth.getSession()).data.session;
  if (!session) { $('login').classList.remove('hide'); $('app').classList.add('hide'); return; }
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('who').textContent = session.user.email;
  if (await loadAll()) render();
}
boot();
</script>
